    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
        }

        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif;}
        .app-container { min-height: 100vh; position: relative; }

        /* 🚀 FLUID HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 100px 20px; /* High bottom padding for sheet overlap */
            color: white; text-align: center;
        }
        .header-top-flex { display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; backdrop-filter: blur(5px); transition: 0.2s;}
        .back-btn:active { transform: scale(0.9); }
        
        .hero-title { font-size: 24px; font-weight: 800; margin: 15px 0 5px; letter-spacing: -0.5px;}
        .hero-subtitle { font-size: 13px; color: #bae6fd; font-weight: 500; margin: 0;}

        /* 🚀 CONTINUOUS CONTENT SHEET */
        .content-sheet {
            background: white; border-radius: 40px 40px 0 0;
            padding: 65px 20px 40px; margin-top: -40px; /* Slides over the blue background */
            position: relative; z-index: 10; min-height: 50vh;
        }

        /* 🚀 FLOATING CIRCULAR ICON */
        .floating-icon {
            width: 90px; height: 90px; background: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(11, 18, 32, 0.08); font-size: 38px; color: var(--brand-color);
            position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
        }

        .contact-intro { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 30px; text-align: center; font-weight: 500; padding: 0 10px;}

        /* 🚀 UPGRADED FORM INPUTS */
        .form-group { margin-bottom: 22px; }
        .form-group label { display: block; font-weight: 800; font-size: 12px; margin-bottom: 8px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; padding-left: 5px;}
        
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 16px; transition: 0.2s; }
        
        .form-input { 
            width: 100%; padding: 16px 16px 16px 50px; border: 2px solid #e2e8f0; 
            border-radius: 16px; background: #F5F8FC; font-size: 14px; color: var(--text-main);
            outline: none; transition: 0.2s; box-sizing: border-box; font-family: 'Sora', sans-serif; font-weight: 500;
        }
        textarea.form-input { padding-left: 20px; resize: vertical; min-height: 120px; border-radius: 20px;}
        
        .form-input:focus { border-color: var(--brand-color); background: white; box-shadow: 0 4px 15px rgba(29, 94, 208, 0.1); }
        .input-wrapper:focus-within .input-icon { color: var(--brand-color); }
        
        .submit-btn { 
            width: 100%; padding: 18px; background: var(--brand-color); color: white; border: none; 
            border-radius: 16px; font-weight: 800; font-size: 15px; cursor: pointer; transition: 0.2s; 
            box-shadow: 0 8px 25px rgba(29, 94, 208, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px;
            margin-top: 10px;
        }
        .submit-btn:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(29, 94, 208, 0.2); }
        
        /* 🚀 OR DIVIDER */
        .divider { display: flex; align-items: center; text-align: center; margin: 35px 0; color: #94a3b8; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;}
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 2px dashed #e2e8f0; }
        .divider:not(:empty):before { margin-right: 15px; }
        .divider:not(:empty):after { margin-left: 15px; }

        /* 🚀 APP-LIKE WHATSAPP TILES */
        .whatsapp-row { display: flex; gap: 15px; }
        .wa-btn { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; 
            background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; padding: 22px 10px; 
            border-radius: 20px; font-weight: 800; font-size: 14px; text-decoration: none; 
            transition: 0.2s; text-align: center; box-shadow: 0 6px 15px rgba(22, 163, 74, 0.08);
        }
        .wa-btn i { font-size: 30px; }
        .wa-btn span { font-size: 12px; font-weight: 600; opacity: 0.8; }
        .wa-btn:active { transform: scale(0.96); background: #dcfce7; box-shadow: 0 2px 8px rgba(22, 163, 74, 0.05);}

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY THEME)      */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, var(--brand-color), var(--navy-deep)) !important; }
        body.dark-mode .back-btn { background: rgba(255,255,255,0.1) !important; }
        
        body.dark-mode .content-sheet { background: #0B1220 !important; }
        body.dark-mode .floating-icon { background: #071A3A !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;}
        
        body.dark-mode .contact-intro { color: #94a3b8 !important; }
        
        body.dark-mode .form-group label { color: #f1f5f9 !important; }
        body.dark-mode .form-input { background: #071A3A !important; border-color: #1a2c4d !important; color: #f1f5f9 !important; }
        body.dark-mode .form-input:focus { border-color: var(--brand-color) !important; background: #0B1220 !important;}
        body.dark-mode .input-icon { color: #64748b !important; }
        
        body.dark-mode .divider { color: #64748b !important; }
        body.dark-mode .divider::before, body.dark-mode .divider::after { border-bottom-color: #1a2c4d !important; }

        body.dark-mode .wa-btn { background: rgba(22, 163, 74, 0.1) !important; border-color: rgba(22, 163, 74, 0.3) !important; color: #4ade80 !important; box-shadow: none !important;}
        body.dark-mode .wa-btn:active { background: rgba(22, 163, 74, 0.2) !important; }
    </style>

    <script>

            <form action="https://formsubmit.co/support@brytdgm.name.ng" method="POST">
                <input type="hidden" name="_subject" value="New Support Message from BRYT DGM">
                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://brytdgm.name.ng/contact/index.html"> 

                <div class="form-group">

                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="name" class="form-input" placeholder="Enter your full name" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i class="fas fa-phone-alt input-icon"></i>
                        <input type="tel" name="phone" class="form-input" placeholder="e.g. 08012345678" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Message</label>
                    <textarea name="message" class="form-input" placeholder="How can we help you today?" required></textarea>
                </div>

                <button type="submit" class="submit-btn"><i class="fas fa-paper-plane"></i> Send Message</button>
            </form>
            
            <div class="divider">Or Connect Instantly</div>

            <!-- 🚀 APP-LIKE WHATSAPP TILES -->
            <div class="whatsapp-row">
                <a href="https://wa.me/2349153375488" class="wa-btn">
                    <i class="fab fa-whatsapp"></i> 
                    Support Desk
                    <span>Get help now</span>
                </a>
                <a href="https://wa.me/2347040768581?text=I%20want%20to%20place%20an%20ad" class="wa-btn">
                    <i class="fas fa-bullhorn"></i> 
                    Ads / Promo
                    <span>Boost your shop</span>
                </a>
            </div>
        </div>

    </div>
