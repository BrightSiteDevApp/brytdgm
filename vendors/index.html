    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 15px rgba(11, 18, 32, 0.03);
        }

        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif; }
        .app-container { padding-bottom: 90px; min-height: 100vh; }

        /* 🚀 NEW HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 45px 20px;
            border-radius: 0 0 30px 30px;
            color: white;
            position: relative;
        }
        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .back-btn { color: white; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; backdrop-filter: blur(5px); transition: 0.2s;}
        .back-btn:active { transform: scale(0.9); }
        .page-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.3px;}
        .page-subtitle { font-size: 13px; color: #bae6fd; margin-top: 5px; margin-left: 55px; font-weight: 500; }

        /* 🚀 FLOATING SEARCH BAR */
        .search-container { 
            background: white; border-radius: 16px; display: flex; align-items: center; 
            padding: 14px 18px; margin: -25px 20px 20px; 
            box-shadow: 0 10px 25px rgba(11, 18, 32, 0.08); border: 2px solid white; 
            transition: 0.2s; position: relative; z-index: 10;
        }
        .search-container:focus-within { border-color: var(--brand-color); box-shadow: 0 10px 25px rgba(29, 94, 208, 0.2); }
        .search-container input[type="search"] { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; font-family: 'Sora', sans-serif; color: var(--text-main); font-weight: 500; -webkit-appearance: none;}
        .search-icon { color: var(--brand-color); font-size: 18px; margin-right: 12px; }
        
        /* 🚀 2x2 Grid Layout for Vendors */
        .vendor-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }
        
        /* 🚀 PREMIUM VENDOR CARDS */
        .vendor-card {
            background: white; border-radius: 20px; padding: 20px 10px;
            box-shadow: 0 6px 20px rgba(11, 18, 32, 0.03); border: 1px solid #e2e8f0;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            cursor: pointer; transition: 0.2s; height: 100%; justify-content: center;
            width: 100%; min-width: 0; box-sizing: border-box; overflow: hidden; position: relative;
        }
        .vendor-card:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(11, 18, 32, 0.02); }
        
        .vendor-logo {
            width: 70px; height: 70px; border-radius: 50%; object-fit: cover;
            border: 3px solid #F5F8FC; flex-shrink: 0; margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(11, 18, 32, 0.05); background: #eee;
        }
        
        .vendor-info-wrapper { width: 100%; min-width: 0; }
        
        /* Black Name styling */
        .vendor-name { 
            font-size: 13px; font-weight: 800; color: var(--text-main); margin-bottom: 4px; 
            display: flex; align-items: center; justify-content: center;
            width: 100%; text-transform: uppercase; line-height: 1.2;
        }
        
        .vendor-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
        
        .vendor-desc { 
            font-size: 11px; color: var(--text-muted); line-height: 1.4; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; text-transform: uppercase;
            display: block; font-weight: 600;
        }

        .pin-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: #facc15; padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 800; backdrop-filter: blur(4px); z-index: 10; }

        /* Skeleton Loaders */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .sk-card { 
            background: white; border-radius: 20px; padding: 20px 10px; border: 1px solid #f1f5f9; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            width: 100%; min-width: 0; box-sizing: border-box; overflow: hidden; 
        }
        .sk-v-avatar { width: 70px; height: 70px; border-radius: 50%; flex-shrink: 0; margin-bottom: 12px; }
        .sk-line { height: 12px; }
        .sk-line.medium { width: 80%; margin-bottom: 8px;}
        .sk-line.short { width: 50%; }

        .end-message { text-align: center; padding: 30px 20px 40px; color: #94a3b8; font-size: 13px; font-weight: 700; display: none; }
        .end-message i { font-size: 30px; color: #cbd5e1; margin-bottom: 10px; display: block; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY THEME)      */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, var(--brand-color), var(--navy-deep)) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;}
        body.dark-mode .back-btn { background: rgba(255,255,255,0.1) !important; }
        body.dark-mode .page-title { color: #f1f5f9 !important; }
        
        body.dark-mode .search-container { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important; }
        body.dark-mode .search-container input { color: #f1f5f9 !important; }
        body.dark-mode .search-icon { color: var(--brand-color) !important; }

        body.dark-mode .vendor-card { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: none !important;}
        body.dark-mode .vendor-logo { border-color: #1a2c4d !important; background: #0B1220 !important; }
        body.dark-mode .vendor-name { color: #f1f5f9 !important; }
        body.dark-mode .vendor-desc { color: #94a3b8 !important; }

        body.dark-mode .sk-card { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .end-message { color: #94a3b8 !important; }
        body.dark-mode .end-message i { color: #334155 !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #071A3A 25%, #0B1220 50%, #071A3A 75%) !important; background-size: 200% 100% !important; }
        
        body.dark-mode .nav-fab { background: var(--brand-color) !important; border: none !important; color: white !important; }
    </style>

<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <!-- 🚀 NEW HERO HEADER -->
        <div class="hero-header">
            <div class="header-top-flex">
                <button onclick="window.history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h1 class="page-title">Verified Sellers</h1>
            </div>
            <div class="page-subtitle">Shop safely from trusted campus entrepreneurs</div>
        </div>
        
        <!-- 🚀 FLOATING SEARCH -->
        <form class="search-container" action="#" onsubmit="return triggerSearch(event)">
            <i class="fas fa-search search-icon" onclick="triggerSearch(event)"></i>
            <input type="search" id="vendor-search" placeholder="Search brands, categories...">
        </form>

        <div class="content-area" style="padding: 0 0 90px 0;">
            
            <div class="vendor-grid" id="main-vendor-grid"></div>

            <div class="vendor-grid" id="skeleton-loader" style="padding-top: 15px; display: none;">
                <div class="sk-card"><div class="sk-shimmer sk-v-avatar"></div><div class="sk-shimmer sk-line medium"></div><div class="sk-shimmer sk-line short"></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-v-avatar"></div><div class="sk-shimmer sk-line medium"></div><div class="sk-shimmer sk-line short"></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-v-avatar"></div><div class="sk-shimmer sk-line medium"></div><div class="sk-shimmer sk-line short"></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-v-avatar"></div><div class="sk-shimmer sk-line medium"></div><div class="sk-shimmer sk-line short"></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-v-avatar"></div><div class="sk-shimmer sk-line medium"></div><div class="sk-shimmer sk-line short"></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-v-avatar"></div><div class="sk-shimmer sk-line medium"></div><div class="sk-shimmer sk-line short"></div></div>
            </div>

            <div id="scroll-sentinel" style="height: 1px; width: 100%;"></div>

            <div class="end-message" id="end-message">
                <i class="fas fa-check-circle"></i>
                You've seen all verified sellers.
            </div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')" style="background: var(--brand-color); color: white; border: none; box-shadow: 0 4px 15px rgba(29, 94, 208, 0.4);"><i class="fas fa-plus"></i></div>
            <a href="#" class="nav-item" onclick="requireLogin('../saved/index.html')"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/index.html')"><i class="fas fa-user"></i><span>Account</span></a>
        </div>

    </div>

    <script src="../asset/script.js"></script>

   <script>
        let allVendors = [];
        let currentDisplayList = [];
        let vendorsLoaded = 0;
        let isFetchingBatch = false;

        document.addEventListener("DOMContentLoaded", () => {
            fetchActiveVendors();
        });

        async function requireLogin(targetUrl) {
            if (typeof supabaseClient === 'undefined') {
                window.location.href = "../login/index.html";
                return;
            }
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

      async function fetchActiveVendors() {
            document.getElementById('skeleton-loader').style.display = 'grid';
            try {
                const { data, error } = await supabaseClient
                    .from('vendors')
                    .select('id, vendor_code, business_name, description, logo_url, subscription_plan, is_pinned') 
                    .eq('is_active', true)
                    .order('is_pinned', { ascending: false }); 

                if (error) throw error;

                // Keep pinned items at the top, shuffle the rest
                const pinned = data.filter(v => v.is_pinned === true);
                const unpinned = shuffleArray(data.filter(v => v.is_pinned !== true));
                
                allVendors = [...pinned, ...unpinned];
                currentDisplayList = [...allVendors];
                
                loadNextBatch();
                observer.observe(document.getElementById('scroll-sentinel'));

            } catch (error) {
                document.getElementById('skeleton-loader').style.display = 'none';
                document.getElementById('main-vendor-grid').innerHTML = '<p style="grid-column:span 2; text-align:center; color:#ef4444; padding: 40px; font-weight:600;">Failed to load vendors.</p>';
            }
        }

        function loadNextBatch() {
            if (isFetchingBatch) return;

            const grid = document.getElementById('main-vendor-grid');
            const skeleton = document.getElementById('skeleton-loader');
            const endMsg = document.getElementById('end-message');
            
            if (currentDisplayList.length === 0) {
                grid.innerHTML = 
                    '<div style="grid-column: span 2; text-align: center; padding: 60px 20px; color: #94a3b8;">' +
                        '<i class="fas fa-store-slash" style="font-size: 50px; margin-bottom: 15px; color: #cbd5e1;"></i>' +
                        '<h3 style="font-size: 16px; color: var(--text-main); margin: 0 0 5px;">No vendor found</h3>' +
                        '<p style="font-size: 13px;">Try adjusting your search terms.</p>' +
                    '</div>';
                endMsg.style.display = 'none';
                skeleton.style.display = 'none';
                return;
            }

            if (vendorsLoaded >= currentDisplayList.length) return;

            isFetchingBatch = true;
            skeleton.style.display = 'grid';

            setTimeout(() => {
                skeleton.style.display = 'none';

                const batchSize = vendorsLoaded === 0 ? 30 : 20;
                const nextBatch = currentDisplayList.slice(vendorsLoaded, vendorsLoaded + batchSize);

                const htmlStrings = nextBatch.map(v => {
                    const logoUrl = v.logo_url || 'https://via.placeholder.com/100x100?text=Logo';
                    const safeName = v.business_name ? v.business_name : 'Verified Vendor';
                    const safeDesc = v.description || "Vendor";

                    let badgeColor = "var(--brand-color)"; 
                    if (v.subscription_plan === "Influencer") badgeColor = "#fbbf24"; 
                    if (v.subscription_plan === "Icon") badgeColor = "#1a2c4d"; 

                    // The Pin Badge
                    const pinBadge = v.is_pinned ? '<div class="pin-badge"><i class="fas fa-thumbtack"></i> Featured</div>' : '';

                    return '<div class="vendor-card" onclick="window.location.href=\'profile/index.html?id=' + escapeJS(v.id) + '\'">' +
                                pinBadge +
                                '<img src="' + escapeHTML(logoUrl) + '" class="vendor-logo" onerror="this.src=\'https://via.placeholder.com/100x100?text=Logo\'">' +
                                '<div class="vendor-info-wrapper">' +
                                    '<div class="vendor-name">' +
                                        '<span class="vendor-name-text">' + escapeHTML(safeName) + '</span>' +
                                        '<i class="fas fa-check-circle" style="color: ' + badgeColor + '; font-size: 12px; flex-shrink: 0; margin-left: 4px;"></i>' +
                                    '</div>' +
                                    '<div class="vendor-desc">' + escapeHTML(safeDesc) + '</div>' +
                                '</div>' +
                            '</div>';
                });

                grid.innerHTML += htmlStrings.join('');
                
                vendorsLoaded += nextBatch.length;
                isFetchingBatch = false;

                if (vendorsLoaded >= currentDisplayList.length) {
                    endMsg.style.display = 'block';
                }
            }, 600);
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                loadNextBatch();
            }
        }, { rootMargin: "100px" });

        function triggerSearch(e) {
            if (e) e.preventDefault(); 
            document.getElementById('vendor-search').blur(); 
            
            const query = document.getElementById('vendor-search').value.toLowerCase().trim();
            
            currentDisplayList = allVendors.filter(v => {
                const codeSearch = (v.vendor_code || "").toLowerCase();
                return (
                    (v.business_name && v.business_name.toLowerCase().includes(query)) || 
                    (v.description && v.description.toLowerCase().includes(query)) ||
                    codeSearch.includes(query)
                );
            });

            vendorsLoaded = 0;
            document.getElementById('main-vendor-grid').innerHTML = "";
            document.getElementById('end-message').style.display = 'none';
            loadNextBatch();

            return false;
        }

        function escapeHTML(str) {
            return str ? String(str).replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag])) : '';
        }
        function escapeJS(str) {
            return str ? String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n') : '';
        }
    </script>
</body>
