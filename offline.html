<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline | BRYT DGM</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="asset/img/bryt-app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    
    <style>
        :root {
            --brand-color: #1D5ED0;
            --bg-color: #F5F8FC;
            --text-main: #0B1220;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Sora', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; overflow: hidden; 
        }

        .container {
            background: white; width: 90%; max-width: 400px;
            padding: 40px 30px; border-radius: 24px; text-align: center;
            box-shadow: 0 10px 40px rgba(11, 18, 32, 0.05);
            border: 1px solid #e2e8f0;
            animation: popUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes popUp {
            from { transform: translateY(20px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .icon-box {
            width: 80px; height: 80px; background: rgba(29, 94, 208, 0.1); color: var(--brand-color);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 35px; margin: 0 auto 20px;
        }

        h1 { font-size: 22px; font-weight: 800; color: var(--text-main); margin-bottom: 10px; letter-spacing: -0.5px;}
        p { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 30px; font-weight: 500;}

        .retry-btn {
            background: var(--brand-color); color: white; border: none;
            width: 100%; padding: 15px; border-radius: 14px; font-size: 15px; font-weight: 800; font-family: 'Sora', sans-serif;
            cursor: pointer; transition: 0.2s; box-shadow: 0 8px 20px rgba(29, 94, 208, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .retry-btn:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(29, 94, 208, 0.2);}

        /* 🌙 DARK MODE (BRYT NAVY THEME) */
        body.dark-mode { background-color: #071A3A; }
        body.dark-mode .container { background: #0B1220; border-color: #1a2c4d; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        body.dark-mode .icon-box { background: #071A3A; }
        body.dark-mode h1 { color: #f1f5f9; }
        body.dark-mode p { color: #94a3b8; }
    </style>
</head>
<body>

    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="container">
        <div class="icon-box">
            <i class="fas fa-wifi"></i>
        </div>
        <h1>You are offline</h1>
        <p>It looks like you've lost your internet connection. Please check your network and try again to continue browsing the market.</p>
        
        <button class="retry-btn" onclick="checkNetwork()">
            <i class="fas fa-redo-alt"></i> Try Again
        </button>
    </div>

    <script>
        function checkNetwork() {
            const btn = document.querySelector('.retry-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Checking...';
            
            setTimeout(() => {
                if (navigator.onLine) {
                    window.history.back(); // Go back to the page they were trying to load
                    // Fallback if history is empty:
                    setTimeout(() => { window.location.href = '/index.html'; }, 100);
                } else {
                    btn.innerHTML = '<i class="fas fa-redo-alt"></i> Try Again';
                    // Optional: shake animation to show it failed
                    document.querySelector('.container').animate([
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 300 });
                }
            }, 800);
        }

        // Automatically reload if the browser detects the network is back
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
