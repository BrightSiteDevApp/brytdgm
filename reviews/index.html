    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
        }

        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif;}
        .app-container { padding-bottom: 0px; min-height: 100vh; position: relative; }

        /* 🚀 PREMIUM HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 30px 20px; 
            border-radius: 0 0 30px 30px;
            color: white;
            position: relative;
        }
        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .back-btn { color: white; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; backdrop-filter: blur(5px); transition: 0.2s;}
        .back-btn:active { transform: scale(0.9); }
        .page-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px;}
        .page-subtitle { font-size: 13px; color: #bae6fd; margin-top: 5px; margin-left: 55px; font-weight: 500; }

        /* 🚀 FLOATING ACTION AREA */
        .action-area { margin: 0px 20px 20px; position: relative; z-index: 10; display: flex; flex-direction: column; gap: 15px;} 
        
        .write-btn {
            background: white; color: var(--brand-color); border: none; width: 100%;
            padding: 16px 24px; border-radius: 16px; font-weight: 800; font-size: 15px; font-family: 'Sora', sans-serif;
            cursor: pointer; box-shadow: 0 10px 25px rgba(11, 18, 32, 0.08);
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .write-btn:active { transform: scale(0.98); box-shadow: 0 4px 10px rgba(11, 18, 32, 0.05); }

        .filter-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .filter-btn {
            padding: 10px 18px; border: 1px solid #e2e8f0; background: white;
            border-radius: 14px; font-size: 13px; font-weight: 700; cursor: pointer;
            white-space: nowrap; color: var(--text-muted); transition: 0.2s; box-shadow: 0 2px 8px rgba(11, 18, 32, 0.02);
            font-family: 'Sora', sans-serif;
        }
        .filter-btn.active { background: var(--brand-color); color: white; border-color: var(--brand-color); box-shadow: 0 4px 15px rgba(29, 94, 208, 0.3);}

        /* 🚀 REVIEWS CARDS */
        #reviews-container { display: flex !important; flex-direction: column !important; width: 100% !important; gap: 15px !important; padding: 0 20px; }

        .review-card {
            background: white; border-radius: 20px; padding: 20px;
            box-shadow: 0 4px 20px rgba(11, 18, 32, 0.03); border: 1px solid #f1f5f9;
            width: 100% !important; box-sizing: border-box; position: relative; transition: 0.2s;
        }
        .review-card:active { transform: scale(0.98); }
        
        .rev-header-flex { display: flex; justify-content: space-between; align-items: flex-start; }
        .rev-user-info { display: flex; gap: 12px; align-items: center; }
        .rev-avatar { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; background: #F5F8FC; border: 2px solid #F5F8FC; }
        .rev-name { font-size: 15px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 6px;}
        .rev-stars { font-size: 11px; color: #f59e0b; margin: 3px 0; }
        .rev-date { font-size: 11px; color: var(--text-muted); font-weight: 600; }
        .rev-body { margin-top: 15px; font-size: 14px; line-height: 1.6; color: #475569; background: #F5F8FC; padding: 15px; border-radius: 0 16px 16px 16px; border: 1px solid #e2e8f0; font-weight: 500;}

        .pending-badge { background: #fefce8; color: #eab308; border: 1px solid #fef08a; padding: 3px 8px; border-radius: 8px; font-size: 9px; font-weight: 800; }
        .action-icon { font-size: 15px; color: #cbd5e1; cursor: pointer; margin-left: 15px; transition: 0.2s; }
        .action-icon:hover { color: var(--brand-color); }
        .action-delete:hover { color: #ef4444; }

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* 🚀 APP-LIKE CALL TO ACTION */
        .cta-box { 
            background: linear-gradient(135deg, var(--navy-deep), #0B1220); color: white; text-align: center; 
            padding: 40px 20px; border-radius: 24px; margin: 30px 20px 20px; box-shadow: 0 10px 30px rgba(11, 18, 32, 0.1);
            border: 1px solid #1a2c4d;
        }

        /* MODAL STYLES */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 26, 58, 0.8); backdrop-filter: blur(5px); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: white; padding: 30px 25px; border-radius: 24px; width: 100%; max-width: 400px;
            position: relative; box-shadow: 0 20px 50px rgba(11, 18, 32, 0.2); animation: slideUp 0.3s ease-out; box-sizing: border-box;
        }
        @keyframes slideUp { from { transform: translateY(30px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: #94a3b8; background: #f5f8fc; width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; }
        .star-selector { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .star-selector i { font-size: 35px; color: #e2e8f0; cursor: pointer; transition: 0.2s; }
        .star-selector i.active { color: #f59e0b; text-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .modal-textarea {
            width: 100%; height: 120px; padding: 15px; border: 2px solid #e2e8f0; border-radius: 14px;
            outline: none; font-size: 14px; font-family: 'Sora', sans-serif; resize: none; margin-bottom: 15px;
            box-sizing: border-box; background: #F5F8FC; transition: 0.2s; font-weight: 500;
        }
        .modal-textarea:focus { border-color: var(--brand-color); background: white; }
        .modal-submit-btn { background: var(--brand-color); color: white; border: none; width: 100%; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 15px; cursor: pointer; font-family: 'Sora', sans-serif; transition: 0.2s;}
        .modal-submit-btn:active { transform: scale(0.96); }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY THEME)      */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, var(--brand-color), var(--navy-deep)) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;}
        body.dark-mode .back-btn { background: rgba(255,255,255,0.1) !important; }
        body.dark-mode .page-title { color: #f1f5f9 !important; }

        body.dark-mode .write-btn { background: #071A3A !important; color: #f1f5f9 !important; border: 1px solid #1a2c4d; box-shadow: none !important;}
        body.dark-mode .filter-btn { background: #071A3A !important; border-color: #1a2c4d !important; color: #94a3b8 !important; }
        body.dark-mode .filter-btn.active { background: var(--brand-color) !important; color: white !important; border-color: var(--brand-color) !important; }
        
        body.dark-mode .review-card { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: none !important; }
        body.dark-mode .rev-name { color: #f1f5f9 !important; }
        body.dark-mode .rev-date { color: #64748b !important; }
        body.dark-mode .rev-body { color: #cbd5e1 !important; background: #0B1220 !important; border-color: #1a2c4d !important; }
        body.dark-mode .rev-avatar { border-color: #1a2c4d !important; background: #0B1220 !important; }
        
        body.dark-mode .pending-badge { background: rgba(245, 158, 11, 0.1) !important; color: #fcd34d !important; border-color: #b45309 !important; }
        body.dark-mode .action-icon { color: #475569 !important; }
        body.dark-mode .action-icon:hover { color: var(--brand-color) !important; }
        body.dark-mode .action-delete:hover { color: #ef4444 !important; }
        
        body.dark-mode .cta-box { background: #071A3A !important; border: 1px solid #1a2c4d; }
        body.dark-mode .cta-box h3 { color: #f1f5f9 !important; }
        body.dark-mode .cta-box p { color: #94a3b8 !important; }
        
        body.dark-mode .modal-overlay { background: rgba(7, 26, 58, 0.8) !important; }
        body.dark-mode .modal-content { background: #071A3A !important; box-shadow: 0 20px 40px rgba(0,0,0,0.8) !important; border: 1px solid #1a2c4d;}
        body.dark-mode #modalTitle { color: #f1f5f9 !important; }
        body.dark-mode .star-selector i { color: #1a2c4d !important; }
        body.dark-mode .star-selector i.active { color: #f59e0b !important; }
        body.dark-mode .modal-textarea { background: #0B1220 !important; border-color: #1a2c4d !important; color: #f1f5f9 !important; }
        body.dark-mode .modal-textarea:focus { border-color: var(--brand-color) !important; }
        body.dark-mode .close-modal { background: #1a2c4d !important; color: #f1f5f9 !important; }
        
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #071A3A 25%, #0B1220 50%, #071A3A 75%) !important; background-size: 200% 100% !important; }
    </style>

<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <div class="hero-header">
            <div class="header-top-flex">
                <button onclick="window.history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h1 class="page-title">Community Reviews</h1>
            </div>
            <div class="page-subtitle">Real feedback from students.</div>
        </div>

        <div class="content-area">
            
            <div class="action-area">
                <button class="write-btn" onclick="openReviewModal()">
                    <i class="fas fa-pen"></i> Drop a Review
                </button>

                <div class="filter-scroll">
                    <button class="filter-btn active" onclick="filterReviews('all', this)">All Ratings</button>
                    <button class="filter-btn" onclick="filterReviews(5, this)">5 <i class="fas fa-star" style="color:#f59e0b;"></i></button>
                    <button class="filter-btn" onclick="filterReviews(4, this)">4 <i class="fas fa-star" style="color:#f59e0b;"></i></button>
                    <button class="filter-btn" onclick="filterReviews(3, this)">3 <i class="fas fa-star" style="color:#f59e0b;"></i></button>
                    <button class="filter-btn" onclick="filterReviews(2, this)">2 <i class="fas fa-star" style="color:#f59e0b;"></i></button>
                    <button class="filter-btn" onclick="filterReviews(1, this)">1 <i class="fas fa-star" style="color:#f59e0b;"></i></button>
                </div>
            </div>

            <div id="reviews-container">
                <div class="review-card">
                    <div style="display:flex; gap:10px; margin-bottom:15px;">
                        <div class="sk-shimmer" style="width:50px; height:50px; border-radius:50%;"></div>
                        <div style="flex:1;">
                            <div class="sk-shimmer" style="width:50%; height:14px; margin-bottom:8px;"></div>
                            <div class="sk-shimmer" style="width:30%; height:10px;"></div>
                        </div>
                    </div>
                    <div class="sk-shimmer" style="width:100%; height:14px; margin-bottom:8px;"></div>
                    <div class="sk-shimmer" style="width:80%; height:14px;"></div>
                </div>
            </div>

            <div class="cta-box">
                <div style="font-size: 45px; margin-bottom: 10px; text-shadow: 0 4px 10px rgba(0,0,0,0.3);">🤝</div>
                <h3 style="font-size: 18px; margin-bottom: 8px; font-weight: 800;">Got scammed or served well?</h3>
                <p style="font-size: 13px; margin-bottom: 25px; color: #cbd5e1; font-weight: 500;">Keep the market safe by sharing your honest experience.</p>
                <button class="modal-submit-btn" style="background: white; color: #0f172a;" onclick="openReviewModal()">Write a Review</button>
            </div>

        </div>

        <div id="reviewModal" class="modal-overlay">
            <div class="modal-content">
                <span class="close-modal" onclick="closeReviewModal()"><i class="fas fa-times" style="font-size: 16px;"></i></span>
                <h3 id="modalTitle" style="text-align:center; color: var(--text-main); font-size: 20px; font-weight: 800; margin: 0 0 5px; letter-spacing: -0.3px;">Rate your experience</h3>
                
                <div class="star-selector" id="starInput">
                    <i class="fas fa-star" data-val="1"></i>
                    <i class="fas fa-star" data-val="2"></i>
                    <i class="fas fa-star" data-val="3"></i>
                    <i class="fas fa-star" data-val="4"></i>
                    <i class="fas fa-star" data-val="5"></i>
                </div>
                
                <textarea id="reviewText" class="modal-textarea" placeholder="Be honest. Did you get what you paid for?"></textarea>
                <p id="reviewError" style="color:#ef4444; font-size:12px; text-align:center; display:none; font-weight: 800; margin-bottom: 10px;"></p>
                
                <button class="modal-submit-btn" id="submit-btn" onclick="submitReview()">Post Review</button>
            </div>
        </div>

    </div>

    <script src="../asset/script.js"></script>

    <script>
        let currentUser = null;
        let allReviews = [];
        let selectedRating = 0;
        let editingReviewId = null;

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) currentUser = session.user;
            fetchReviews();
        });

        function timeAgo(dateString) {
            const seconds = Math.floor((new Date() - new Date(dateString)) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + " years ago";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + " months ago";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + " days ago";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + " hours ago";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + " mins ago";
            return "Just now";
        }

        async function fetchReviews() {
            try {
                const { data, error } = await supabaseClient
                    .from('reviews')
                    .select('id, rating, review_text, status, created_at, user_id, legacy_name, legacy_avatar, profiles ( full_name, avatar_url )')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                
                allReviews = data.filter(r => r.status === 'approved' || (currentUser && r.user_id === currentUser.id));
                renderReviews(allReviews);
            } catch (error) {
                console.error("Supabase error:", error);
                document.getElementById('reviews-container').innerHTML = '<p style="text-align:center; color:#ef4444; padding: 40px; font-weight: 600;">Failed to load reviews.</p>';
            }
        }

        window.renderReviews = function(dataArray) {
            const container = document.getElementById('reviews-container');
            container.innerHTML = "";

            if (dataArray.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 40px;">No reviews found here.</p>';
                return;
            }

            const htmlStrings = dataArray.map(r => {
                const starsHtml = '<i class="fas fa-star" style="color: #f59e0b;"></i>'.repeat(r.rating);
                const isPending = r.status === 'pending' ? '<span class="pending-badge">PENDING</span>' : '';
                
                const authorName = escapeHTML(r.profiles?.full_name || r.legacy_name || "Student");
                
                // 🚀 BRYT BLUE AVATAR BACKGROUND UPDATE
                const fallbackAvatar = "https://ui-avatars.com/api/?name=" + encodeURIComponent(authorName) + "&background=1D5ED0&color=fff&bold=true";
                const authorImg = r.profiles?.avatar_url || r.legacy_avatar ? escapeHTML(r.profiles?.avatar_url || r.legacy_avatar) : fallbackAvatar;
                
                const dateText = escapeHTML(timeAgo(r.created_at));

                let actionHtml = "";
                if (currentUser && r.user_id === currentUser.id) {
                    const safeText = escapeJS(r.review_text);
                    actionHtml = '<div>' +
                                    '<i class="fas fa-pen action-icon" onclick="openEditModal(\'' + escapeJS(r.id) + '\', \'' + safeText + '\', ' + r.rating + ')"></i>' +
                                    '<i class="fas fa-trash-alt action-icon action-delete" onclick="deleteReview(\'' + escapeJS(r.id) + '\')"></i>' +
                                 '</div>';
                }

                return '<div class="review-card">' +
                            '<div class="rev-header-flex">' +
                                '<div class="rev-user-info">' +
                                    '<img src="' + authorImg + '" class="rev-avatar" onerror="this.src=\'' + fallbackAvatar + '\'">' +
                                    '<div>' +
                                        '<div class="rev-name">' + authorName + ' ' + isPending + '</div>' +
                                        '<div class="rev-stars">' + starsHtml + '</div>' +
                                        '<div class="rev-date">' + dateText + '</div>' +
                                    '</div>' +
                                '</div>' +
                                actionHtml +
                            '</div>' +
                            '<div class="rev-body">"' + escapeHTML(r.review_text) + '"</div>' +
                       '</div>';
            });

            container.innerHTML = htmlStrings.join('');
        }

        window.filterReviews = function(rating, btnElement) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            if (rating === 'all') renderReviews(allReviews);
            else renderReviews(allReviews.filter(r => r.rating === rating));
        }

        window.openReviewModal = function() {
            if (!currentUser) { alert("Please log in to drop a review!"); window.location.href = "../login/index.html"; return; }
            
            const myReviewCount = allReviews.filter(r => r.user_id === currentUser.id).length;
            
            if (!editingReviewId && myReviewCount >= 2) { alert("Max limit of 2 reviews reached."); return; }
            document.getElementById('reviewModal').style.display = 'flex';
        }

        window.closeReviewModal = function() {
            document.getElementById('reviewModal').style.display = 'none';
            selectedRating = 0; editingReviewId = null; updateStars();
            document.getElementById('reviewText').value = "";
            document.getElementById('reviewError').style.display = 'none';
            document.getElementById('modalTitle').innerText = "Rate your experience";
        }

        window.openEditModal = function(id, text, rating) {
            editingReviewId = id;
            document.getElementById('modalTitle').innerText = "Edit your review";
            document.getElementById('reviewText').value = text;
            selectedRating = rating;
            updateStars();
            document.getElementById('reviewModal').style.display = 'flex';
        }

        document.querySelectorAll('#starInput i').forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.getAttribute('data-val'));
                updateStars();
            });
        });

        function updateStars() {
            document.querySelectorAll('#starInput i').forEach(star => {
                const val = parseInt(star.getAttribute('data-val'));
                star.className = val <= selectedRating ? 'fas fa-star active' : 'fas fa-star';
            });
        }

        window.submitReview = async function() {
            const text = document.getElementById('reviewText').value.trim();
            const errorMsg = document.getElementById('reviewError');
            
            if (selectedRating === 0) { errorMsg.innerText = "Please select a star rating."; errorMsg.style.display = 'block'; return; }
            if (text.length < 5) { errorMsg.innerText = "Review is too short."; errorMsg.style.display = 'block'; return; }

            const btn = document.getElementById('submit-btn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting...'; 
            btn.disabled = true;

            try {
                if (editingReviewId) {
                    await supabaseClient.from('reviews').update({ rating: selectedRating, review_text: text, status: 'pending' }).eq('id', editingReviewId);
                    alert("Review updated! It is pending admin approval.");
                } else {
                    await supabaseClient.from('reviews').insert([{ user_id: currentUser.id, rating: selectedRating, review_text: text, status: 'pending' }]);
                    alert("Review posted! It will appear as 'PENDING' until approved.");
                }
                closeReviewModal(); fetchReviews();
            } catch (error) { errorMsg.innerText = "Network error. Try again."; errorMsg.style.display = 'block'; } 
            finally { btn.innerText = "Post Review"; btn.disabled = false; }
        }

        window.deleteReview = async function(id) {
            if (!confirm("Delete this review forever?")) return;
            try { await supabaseClient.from('reviews').delete().eq('id', id); fetchReviews(); } 
            catch (error) { alert("Failed to delete review."); }
        }
    </script>
</body>
</html>
