        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {

            --text-main: #0B1220;

        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif;}
        .app-container { padding-bottom: 90px; min-height: 100vh; background: #F5F8FC;}

        /* 🚀 PREMIUM HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 60px 20px;

        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }

        }
        .qn-text { font-size: 11px; font-weight: 700; color: var(--text-main); text-align: center; line-height: 1.2;}

        /* 🚀 SECTION HEADERS */
        .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin: 35px 20px 15px; }
        .section-header-title { font-size: 18px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; margin: 0; letter-spacing: -0.3px;}
        .section-header-link { font-size: 13px; color: var(--brand-color); font-weight: 800; text-decoration: none; background: rgba(29, 94, 208, 0.1); padding: 6px 12px; border-radius: 12px; transition: 0.2s;}
        .section-header-link:active { transform: scale(0.95); }

        /* 🚀 MINI SLIDERS (For Items in Categories) */
        .mini-slider {
            display: flex; overflow-x: auto; gap: 12px; padding: 0 20px 10px;
            scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth;
        }
        .mini-slider::-webkit-scrollbar { display: none; }
        
        .mini-card {
            width: 140px; flex-shrink: 0; scroll-snap-align: start; margin-bottom: 0;
            background: var(--bg-card); border-radius: 16px; padding: 10px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);
            display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s;
        }
        .mini-card:active { transform: scale(0.96); }
        .mini-img { width: 100%; height: 115px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; background: #f5f8fc; }
        .mini-price { font-size: 15px; font-weight: 800; color: var(--brand-color); margin-bottom: 3px; }
        .mini-title { font-size: 12px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px;}
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    <script>
        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        async function requireLogin(targetUrl) {
            if (typeof supabaseClient === 'undefined') {
                window.location.href = "../login/index.html"; return;
            }
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        document.addEventListener("DOMContentLoaded", async () => {
            loadCategorySections();
        });

        // The list of categories to search for and render
        const categoryData = [
            { id: 'Gadgets', title: 'Gadgets & Tech', icon: 'fas fa-mobile-screen', color: '#3b82f6' },
            { id: 'Fashion', title: 'Campus Fashion', icon: 'fas fa-bag-shopping', color: '#ec4899' },
            { id: 'Food', title: 'Food & Pastries', icon: 'fas fa-bowl-food', color: '#f59e0b' },
            { id: 'Beauty', title: 'Beauty & Hair', icon: 'fas fa-spa', color: '#f43f5e' },
            { id: 'CampusServices', title: 'Campus Services', icon: 'fas fa-copy', color: '#059669' },
            { id: 'Electronics', title: 'Electronics', icon: 'fas fa-plug', color: '#0ea5e9' },
            { id: 'Books', title: 'Study Materials', icon: 'fas fa-book-open-reader', color: '#6366f1' },
            { id: 'Accommodation', title: 'Accommodation', icon: 'fas fa-bed', color: '#14b8a6' }
        ];

        async function loadCategorySections() {
            const container = document.getElementById('dynamic-categories-container');
            const loader = document.getElementById('skeleton-loader');

            try {
                // Fetch up to 1000 active products at once to sort locally
                const { data: products, error } = await supabaseClient
                    .from('products')
                    .select('id, name, price, image_urls, category')
                    .eq('status', 'Active')
                    .limit(1000);

                if (error) throw error;
                
                loader.style.display = 'none';

                if (!products || products.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#94a3b8; padding: 40px;">No items found in the marketplace yet.</p>';
                    return;
                }

                let finalHtml = '';

                categoryData.forEach(cat => {
                    const catItems = products.filter(p => p.category === cat.id).slice(0, 10);

                    if (catItems.length > 0) {
                        
                        const cardsHtml = catItems.map(p => {
                            const imgUrl = (p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://via.placeholder.com/300';
                            const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(p.price);
                            
                            return '<div class="mini-card" onclick="window.location.href=\'../product/index.html?id=' + escapeJS(p.id) + '\'">' +
                                   '<img src="' + escapeHTML(imgUrl) + '" class="mini-img" onerror="this.src=\'https://via.placeholder.com/300\'">' +
                                   '<div class="mini-price">' + fPrice + '</div>' +
                                   '<div class="mini-title">' + escapeHTML(p.name) + '</div>' +
                                   '</div>';
                        }).join('');

                        finalHtml += '<div class="section-header-flex">' +
                                        '<h3 class="section-header-title">' +
                                            '<i class="' + cat.icon + '" style="color: ' + cat.color + ';"></i> ' + cat.title +
                                        '</h3>' +
                                        '<a href="../items/index.html?cat=' + encodeURIComponent(cat.id) + '" class="section-header-link">View all &rarr;</a>' +
                                     '</div>' +
                                     '<div class="mini-slider auto-scroll-slider">' +
                                        cardsHtml +
                                     '</div>';
                    }
                });

                container.innerHTML = finalHtml;
                initAutoScroll();

            } catch (err) {
                console.error("Failed to load category sections", err);
                loader.style.display = 'none';
                container.innerHTML = '<p style="text-align:center; color:#ef4444; padding: 40px;">Failed to load marketplace items. Please check your connection.</p>';
            }
        }

        // 🚀 UNIVERSAL AUTO-SCROLL CONTROLLER
        function initAutoScroll() {
            const sliders = document.querySelectorAll('.auto-scroll-slider');
            sliders.forEach(s => {
                if (s.children.length > 2) {
                    setInterval(() => {
                        const card = s.firstElementChild;
                        if(!card) return;
                        const maxScroll = s.scrollWidth - s.clientWidth;
                        
                        if (s.scrollLeft >= maxScroll - 10) {
                            s.scrollTo({ left: 0, behavior: 'smooth' }); 
                        } else {
                            s.scrollBy({ left: card.offsetWidth + 12, behavior: 'smooth' }); 
                        }
                    }, 2500); 
                }
            });
        }
    </script>
