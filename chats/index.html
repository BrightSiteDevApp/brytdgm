<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat | BRYT DGM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../asset/img/bryt-app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
            --bg-body: #F5F8FC;
        }

        /* 🚀 BULLETPROOF NATIVE SCROLLING FIX */
        body, html { 
            margin: 0; padding: 0; 
            background: var(--bg-body); 
            font-family: 'Sora', sans-serif;
        }
        
        .chat-container { 
            width: 100%;
            margin: 0 auto; 
            background: white; 
            min-height: 100vh;
        }
        
        /* Header - Fixed strictly to the top */
        .chat-header { 
            position: fixed;
            top: 0; left: 0; right: 0;
            width: 100%; 
            background: white; padding: 15px 20px; display: flex; align-items: center; 
            border-bottom: 1px solid #e2e8f0; z-index: 1000; box-shadow: 0 2px 10px rgba(11,18,32,0.02); 
            box-sizing: border-box;
        }
        .chat-title-area { margin-left: 15px; flex: 1; min-width: 0; }
        .chat-title { font-size: 16px; font-weight: 800; color: var(--text-main); margin: 0 0 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px;}
        .chat-subtitle { font-size: 12px; color: var(--brand-color); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Messages Area - Uses padding to avoid hiding behind the fixed header/footer */
        .chat-area { 
            padding-top: 80px;  /* Space for the header */
            padding-bottom: 100px; /* Space for the input box */
            padding-left: 20px;
            padding-right: 20px;
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        .disclaimer-box { background: #fffbeb; border: 1px solid #fde68a; color: #b45309; padding: 10px 15px; border-radius: 12px; font-size: 11px; text-align: center; margin-bottom: 10px; line-height: 1.5; flex-shrink: 0;}

        /* Bubbles */
        .msg-row { display: flex; flex-direction: column; width: 100%; flex-shrink: 0;}
        
        .msg-row.me { align-items: flex-end; }
        .msg-row.them { align-items: flex-start; }
        
        .bubble { 
            padding: 10px 16px; 
            border-radius: 18px; 
            font-size: 14px; 
            line-height: 1.4; 
            word-wrap: break-word; 
            position: relative; 
            white-space: pre-wrap; 
            width: fit-content; 
            max-width: 85%; 
            display: inline-block;
        }
        
        .me .bubble { background: var(--brand-color); color: white; border-bottom-right-radius: 4px; }
        .them .bubble { background: white; color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
        .auto-msg .bubble { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; font-size: 13px; font-style: italic; border-bottom-right-radius: 4px; }
        
        .msg-img { max-width: 100%; border-radius: 12px; margin-bottom: 8px; cursor: pointer; display: block; }
        .msg-time { font-size: 10px; color: var(--text-muted); margin-top: 4px; font-weight: 500;}
        .me .msg-time { color: #cbd5e1; text-align: right; }

        /* Input Wrapper - Fixed strictly to the bottom */
        .bottom-wrapper {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            width: 100%; 
            background: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #e2e8f0;
            padding-bottom: env(safe-area-inset-bottom, 0px); /* iPhone Home Bar fix */
        }

        .img-preview-bar { display: none; padding: 10px 20px; background: #f5f8fc; border-bottom: 1px solid #e2e8f0; align-items: center; justify-content: space-between; box-sizing: border-box; }
        .img-preview-bar img { height: 40px; border-radius: 6px; }

        .input-area { 
            padding: 12px 15px; 
            display: flex; 
            align-items: flex-end; 
            gap: 10px; 
            box-sizing: border-box;
        }
        
        .attach-btn { background: #f5f8fc; color: var(--text-muted); border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; transition: 0.2s;}
        .attach-btn:active { background: #e2e8f0; }
        
        .msg-input { flex: 1; background: #f5f8fc; border: 1px solid #e2e8f0; border-radius: 20px; padding: 12px 15px; font-size: 14px; outline: none; max-height: 100px; resize: none; font-family: 'Sora', sans-serif; box-sizing: border-box; transition: 0.2s; }
        .msg-input:focus { border-color: var(--brand-color); background: white;}
        
        .send-btn { background: var(--brand-color); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 16px; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; transition: 0.2s; box-shadow: 0 4px 15px rgba(29, 94, 208, 0.3);}
        .send-btn:active { transform: scale(0.9); }
        .send-btn:disabled { background: #cbd5e1; box-shadow: none;}

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY THEME)      */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .chat-container { background: #0B1220 !important; }
        
        body.dark-mode .chat-header { background: #071A3A !important; border-bottom-color: #1a2c4d !important; }
        body.dark-mode .chat-header button { color: #f1f5f9 !important; }
        body.dark-mode .chat-title { color: #f1f5f9 !important; }
        body.dark-mode .chat-subtitle { color: var(--brand-hover) !important; }
        
        body.dark-mode .disclaimer-box { background: rgba(245, 158, 11, 0.1) !important; border-color: rgba(245, 158, 11, 0.3) !important; color: #fbbf24 !important; }
        
        body.dark-mode .them .bubble { background: #071A3A !important; color: #f1f5f9 !important; border-color: #1a2c4d !important; }
        body.dark-mode .me .bubble { background: var(--brand-color) !important; color: white !important; }
        body.dark-mode .auto-msg .bubble { background: rgba(16, 185, 129, 0.1) !important; color: #34d399 !important; border-color: #10b981 !important; }
        
        body.dark-mode .msg-time { color: #64748b !important; }
        body.dark-mode .me .msg-time { color: #94a3b8 !important; }

        body.dark-mode .bottom-wrapper { background: #071A3A !important; border-top-color: #1a2c4d !important;}
        body.dark-mode .msg-input { background: #0B1220 !important; border-color: #1a2c4d !important; color: #f1f5f9 !important; }
        body.dark-mode .msg-input:focus { border-color: var(--brand-color) !important; }
        body.dark-mode .msg-input::placeholder { color: #64748b !important; }
        
        body.dark-mode .attach-btn { background: #0B1220 !important; color: #94a3b8 !important; }
        body.dark-mode .send-btn { background: var(--brand-color) !important; }
        body.dark-mode .send-btn:disabled { background: #1a2c4d !important; color: #64748b !important; }

        body.dark-mode .img-preview-bar { background: #071A3A !important; border-bottom-color: #1a2c4d !important; }
        body.dark-mode .img-preview-bar span { color: #f1f5f9 !important; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="chat-container">
        
        <div class="chat-header">
            <button onclick="window.history.back()" style="background:none; border:none; font-size:20px; color:var(--text-main); cursor:pointer;"><i class="fas fa-arrow-left"></i></button>
            <div class="chat-title-area">
                <div class="chat-title" id="head-name">Loading...</div>
                <div class="chat-subtitle" id="head-product">...</div>
            </div>
        </div>

        <div class="chat-area" id="chat-box">
            <div class="disclaimer-box" id="disclaimer" style="display: none;">
                <i class="fas fa-shield-alt"></i> Safety Notice: To help vendors contact you quickly, your registered name and phone number will be automatically sent when you send your first message.
            </div>
        </div>

        <div class="bottom-wrapper">
            <div class="img-preview-bar" id="img-preview-bar">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <img id="preview-img" src="">
                    <span style="font-size: 12px; color: var(--text-main); font-weight: bold;">Image attached</span>
                </div>
                <button onclick="clearImage()" style="background:none; border:none; color:#ef4444; font-size:16px; cursor:pointer;"><i class="fas fa-times-circle"></i></button>
            </div>

            <div class="input-area">
                <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
                <button class="attach-btn" onclick="document.getElementById('file-input').click()"><i class="fas fa-image"></i></button>
                <textarea id="msg-input" class="msg-input" rows="1" placeholder="Type a message..."></textarea>
                <button class="send-btn" id="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

    </div>

    <script src="../asset/script.js"></script>

   <script>
        const EMAILJS_PUB_KEY = 'Ww8hT6yumuO2KYzeU'; 
        const EMAILJS_SERVICE = 'service_ukl05om';
        const EMAILJS_VENDOR_TEMPLATE = 'template_rj6x3zo'; 
        const EMAILJS_CUSTOMER_TEMPLATE = 'template_p49e3f2'; 
        emailjs.init(EMAILJS_PUB_KEY);

        const CLOUD_NAME = "dgsblxgni"; 
        const UPLOAD_PRESET = "afit_media";

        let currentUser = null;
        let userProfile = null;
        let currentChat = null;
        let activeChatId = null;
        
        let vendorBusinessName = "Store Vendor";

        const urlParams = new URLSearchParams(window.location.search);
        const urlChatId = urlParams.get('chat_id');
        const urlProductId = urlParams.get('product_id');
        const urlVendorId = urlParams.get('vendor_id');

        let selectedImageFile = null;

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "../login/index.html"; return; }
            currentUser = session.user;

            const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', currentUser.id).single();
            userProfile = profile;

            await initializeChat();

            document.getElementById('msg-input').addEventListener('focus', () => {
                setTimeout(scrollToBottom, 300);
            });
        });

        async function initializeChat() {
            try {
                if (urlChatId) {
                    const { data: chat, error } = await supabaseClient
                        .from('chats')
                        .select('*, products(name)')
                        .eq('id', urlChatId)
                        .single();
                        
                    if (error) throw error;
                    currentChat = chat;
                    activeChatId = chat.id;

                    const { data: customerProfile } = await supabaseClient
                        .from('profiles')
                        .select('full_name')
                        .eq('id', chat.customer_id)
                        .single();
                    if (customerProfile) currentChat.customer_name = customerProfile.full_name;

                } else if (urlProductId && urlVendorId) {
                    const { data: chat } = await supabaseClient.from('chats')
                        .select('*, products(name)')
                        .eq('product_id', urlProductId)
                        .eq('customer_id', currentUser.id)
                        .maybeSingle();

                    if (chat) {
                        currentChat = chat;
                        activeChatId = chat.id;
                        
                        const { data: customerProfile } = await supabaseClient
                            .from('profiles')
                            .select('full_name')
                            .eq('id', chat.customer_id)
                            .single();
                        if (customerProfile) currentChat.customer_name = customerProfile.full_name;

                    } else {
                        document.getElementById('disclaimer').style.display = 'block';
                        const { data: prod } = await supabaseClient.from('products').select('name').eq('id', urlProductId).single();
                        if (prod) {
                            document.getElementById('head-product').innerText = prod.name;
                        }
                    }
                }

                const vId = currentChat ? currentChat.vendor_id : urlVendorId;
                if (vId) {
                    const { data: vData } = await supabaseClient.from('vendors').select('business_name').eq('user_id', vId).maybeSingle();
                    if (vData && vData.business_name) {
                        vendorBusinessName = vData.business_name;
                    }
                }

                setupHeader();

                if (activeChatId) {
                    await fetchMessages();
                    subscribeToRealtime();
                    
                    let readUpdate = {};
                    if (currentUser.id === vId) readUpdate = { unread_by_vendor: false };
                    if (currentUser.id === (currentChat ? currentChat.customer_id : currentUser.id)) readUpdate = { unread_by_customer: false };
                    
                    if (Object.keys(readUpdate).length > 0) {
                        await supabaseClient.from('chats').update(readUpdate).eq('id', activeChatId);
                    }
                }

            } catch (err) { console.error("Initialization Error:", err); }
        }

        function setupHeader() {
            if (currentChat && currentChat.products && currentChat.products.name) {
                document.getElementById('head-product').innerText = currentChat.products.name;
            }
            
            if (currentChat && currentUser.id === currentChat.vendor_id) {
                document.getElementById('head-name').innerText = currentChat.customer_name || "Customer";
            } else {
                document.getElementById('head-name').innerText = vendorBusinessName;
            }
        }

        async function fetchMessages() {
            const { data: msgs } = await supabaseClient.from('messages').select('*').eq('chat_id', activeChatId).order('created_at', { ascending: true });
            
            document.querySelectorAll('.msg-row').forEach(e => e.remove());
            
            msgs.forEach(msg => renderMessage(msg));
            setTimeout(scrollToBottom, 100);
        }

        function renderMessage(msg) {
            const box = document.getElementById('chat-box');
            const isMe = msg.sender_id === currentUser.id;
            const rowClass = isMe ? 'me' : 'them';
            const autoClass = msg.is_auto_message ? 'auto-msg' : '';
            
            let imgHTML = "";
            if (msg.image_url && msg.image_url !== "null" && msg.image_url.trim() !== "") {
                imgHTML = `<img src="${msg.image_url}" class="msg-img" onclick="window.open('${msg.image_url}', '_blank')">`;
            }

            const timeString = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            box.insertAdjacentHTML('beforeend', `
                <div class="msg-row ${rowClass} ${autoClass}">
                    <div class="bubble">${imgHTML}${msg.text ? escapeHTML(msg.text) : ''}</div>
                    <div class="msg-time">${timeString}</div>
                </div>
            `);
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag]));
        }

        function scrollToBottom() {
            const box = document.documentElement; // For native scrolling fix
            window.scrollTo({ top: box.scrollHeight, behavior: 'smooth' });
        }

        function subscribeToRealtime() {
            supabaseClient.channel('custom-all-channel')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `chat_id=eq.${activeChatId}` }, (payload) => {
                if (payload.new.sender_id !== currentUser.id) {
                    renderMessage(payload.new);
                    scrollToBottom();
                    
                    let readUpdate = {};
                    if (currentUser.id === currentChat.vendor_id) readUpdate = { unread_by_vendor: false };
                    if (currentUser.id === currentChat.customer_id) readUpdate = { unread_by_customer: false };
                    supabaseClient.from('chats').update(readUpdate).eq('id', activeChatId);
                }
            }).subscribe();
        }

        function handleImageSelect(e) {
            const file = e.target.files[0];
            if (!file) return;
            selectedImageFile = file;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                document.getElementById('preview-img').src = event.target.result;
                document.getElementById('img-preview-bar').style.display = 'flex';
                scrollToBottom();
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            selectedImageFile = null;
            document.getElementById('file-input').value = "";
            document.getElementById('img-preview-bar').style.display = 'none';
        }

        async function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width; let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function uploadImageToCloudinary() {
            const compressedFile = await compressImage(selectedImageFile);
            const formData = new FormData();
            formData.append('file', compressedFile);
            formData.append('upload_preset', UPLOAD_PRESET);
            const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: formData });
            const data = await res.json();
            return data.secure_url;
        }

        async function getVendorEmail(vId) {
            const { data: vData } = await supabaseClient.from('vendors').select('email').eq('user_id', vId).maybeSingle();
            if (vData && vData.email) return vData.email;

            const { data: rpcEmail } = await supabaseClient.rpc('get_customer_email', { uid: vId });
            if (rpcEmail) return rpcEmail;

            return null;
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            const btn = document.getElementById('send-btn');

            if (!text && !selectedImageFile) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                let imgUrl = null;
                if (selectedImageFile) {
                    imgUrl = await uploadImageToCloudinary();
                    clearImage();
                }

                if (!activeChatId) {
                    const { data: newChat, error: chatErr } = await supabaseClient.from('chats').insert([{
                        product_id: urlProductId,
                        customer_id: currentUser.id,
                        vendor_id: urlVendorId,
                        last_message_text: text || "Sent an image",
                        unread_by_vendor: true
                    }]).select().single();
                    
                    if(chatErr) throw chatErr;
                    currentChat = newChat;
                    activeChatId = newChat.id;
                    
                    document.getElementById('disclaimer').style.display = 'none';
                    subscribeToRealtime();

                    await insertMessage(text, imgUrl, false);

                    const autoText = `System Auto-Contact Details:\nName: ${userProfile.full_name}\nPhone: ${userProfile.phone_number}`;
                    await insertMessage(autoText, null, true);

                    const vEmail = await getVendorEmail(urlVendorId);
                    if(vEmail) {
                        try {
                            await emailjs.send(EMAILJS_SERVICE, EMAILJS_VENDOR_TEMPLATE, { to_email: vEmail });
                        } catch (err) { console.error("Vendor Email failed:", err); }
                    }
                } 
                else {
                    await insertMessage(text, imgUrl, false);
                    
                    const amIVendor = currentUser.id === currentChat.vendor_id;
                    
                    await supabaseClient.from('chats').update({ 
                        last_message_text: text || "Sent an image", 
                        last_message_time: new Date(),
                        unread_by_customer: amIVendor ? true : false, 
                        unread_by_vendor: !amIVendor ? true : false   
                    }).eq('id', activeChatId);

                    if (!amIVendor) {
                        const vEmail = await getVendorEmail(currentChat.vendor_id);
                        if (vEmail) {
                            try {
                                await emailjs.send(EMAILJS_SERVICE, EMAILJS_VENDOR_TEMPLATE, { to_email: vEmail });
                            } catch (err) { console.error("Vendor Reply Email failed:", err); }
                        }
                    }

                    if (amIVendor && currentChat.vendor_has_replied === false) {
                        await supabaseClient.from('chats').update({ vendor_has_replied: true }).eq('id', activeChatId);
                        currentChat.vendor_has_replied = true; 
                        
                        const { data: custEmail } = await supabaseClient.rpc('get_customer_email', { uid: currentChat.customer_id });
                        if(custEmail) {
                            try {
                                await emailjs.send(EMAILJS_SERVICE, EMAILJS_CUSTOMER_TEMPLATE, { to_email: custEmail });
                            } catch (err) { console.error("Customer Email failed:", err); }
                        }
                    }
                }

                input.value = "";
                input.style.height = 'auto';
                setTimeout(scrollToBottom, 100);

            } catch (err) {
                console.error(err);
                alert("Failed to send message");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }
        }
        
        async function insertMessage(text, imgUrl, isAuto) {
            const msgData = {
                chat_id: activeChatId,
                sender_id: currentUser.id,
                text: text,
                image_url: imgUrl,
                is_auto_message: isAuto
            };
            
            const tempMsg = { ...msgData, created_at: new Date().toISOString() };
            renderMessage(tempMsg);
            scrollToBottom();

            await supabaseClient.from('messages').insert([msgData]);
        }

        const textarea = document.getElementById('msg-input');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight < 100 ? this.scrollHeight : 100) + 'px';
            scrollToBottom();
        });
    </script>
</body>
</html>
