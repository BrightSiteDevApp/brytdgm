<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-70VSGR5WBW"></script>
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>All Items & Services | BRYT DGM</title>
    <meta name="description" content="Browse hundreds of products and services on BRYT DGM. Shop for gadgets, fashion, food, and more directly from verified student vendors in the AFIT community.">
    <link rel="canonical" href="https://brytdgm.name.ng/items/">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../asset/img/bryt-app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
        }

        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif; }
        .app-container { padding-bottom: 90px; min-height: 100vh; }
        
        /* 🚀 NEW HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 45px 20px;
            border-radius: 0 0 30px 30px;
            color: white;
            position: relative;
        }
        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .back-btn { color: white; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; backdrop-filter: blur(5px); transition: 0.2s;}
        .back-btn:active { transform: scale(0.9); }
        .page-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.3px;}
        .page-subtitle { font-size: 13px; color: #bae6fd; margin-top: 5px; margin-left: 55px; font-weight: 500; }

        /* 🚀 FLOATING SEARCH BAR */
        .search-container { 
            background: white; border-radius: 16px; display: flex; align-items: center; 
            padding: 14px 18px; margin: -25px 20px 15px; 
            box-shadow: 0 10px 25px rgba(11, 18, 32, 0.08); border: 2px solid white; 
            transition: 0.2s; position: relative; z-index: 10;
        }
        .search-container:focus-within { border-color: var(--brand-color); box-shadow: 0 10px 25px rgba(29, 94, 208, 0.2); }
        .search-container input[type="search"] { border: none; background: transparent; outline: none; width: 100%; font-size: 14px; font-family: 'Sora', sans-serif; color: var(--text-main); font-weight: 500;}
        .search-icon { color: var(--brand-color); font-size: 18px; margin-right: 12px; }
        
        /* 🚀 MODERN CATEGORY PILLS */
        .cat-filter-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 5px 20px 20px; scrollbar-width: none; }
        .cat-filter-scroll::-webkit-scrollbar { display: none; }
        
        .filter-pill { 
            background: white; border: 1px solid #e2e8f0; padding: 10px 18px; border-radius: 14px; 
            font-size: 13px; font-weight: 700; color: var(--text-muted); cursor: pointer; 
            white-space: nowrap; transition: 0.2s; box-shadow: 0 2px 8px rgba(11, 18, 32, 0.02);
        }
        .filter-pill.active { 
            background: var(--brand-color); color: white; border-color: var(--brand-color); 
            box-shadow: 0 6px 15px rgba(29, 94, 208, 0.3); transform: translateY(-2px);
        }

        /* 🚀 PREMIUM EDGE-TO-EDGE PRODUCT CARDS */
        .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }

        .product-card { 
            background: white; border-radius: 20px; padding: 0; box-shadow: 0 6px 20px rgba(11, 18, 32, 0.04); 
            cursor: pointer; border: 1px solid #f1f5f9; position: relative; transition: 0.2s; 
            width: 100%; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column;
        }
        .product-card:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(11, 18, 32, 0.02); }
        
        .product-img-wrap { position: relative; width: 100%; height: 160px; background: #F5F8FC; }
        .product-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Floating Price Badge */
        .product-price-badge { 
            position: absolute; bottom: 10px; right: 10px; background: rgba(255,255,255,0.95); 
            color: var(--brand-color); font-size: 14px; font-weight: 800; padding: 6px 12px; 
            border-radius: 12px; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(11, 18, 32, 0.1);
        }
        
        .multi-img-badge { position: absolute; top: 12px; right: 12px; background: rgba(11, 18, 32, 0.6); color: white; font-size: 10px; padding: 5px 8px; border-radius: 8px; font-weight: bold; backdrop-filter: blur(4px); }
        .pin-badge { position: absolute; top: 12px; left: 12px; background: #facc15; color: #854d0e; font-size: 10px; padding: 4px 10px; border-radius: 8px; font-weight: 800; z-index: 5; box-shadow: 0 4px 10px rgba(11, 18, 32, 0.1); }

        .product-info { padding: 15px 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;}
        .product-title { font-size: 13px; font-weight: 800; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px;}
        .product-location { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}

        /* Skeletons updated for new card shape */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px;}
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .sk-card { background: white; border-radius: 20px; border: 1px solid #f1f5f9; overflow: hidden; }
        .sk-img { width: 100%; height: 160px; border-radius: 0; }
        .sk-info { padding: 15px 12px; }
        .sk-line-1 { width: 80%; height: 14px; margin-bottom: 10px; }
        .sk-line-2 { width: 50%; height: 12px; }

        .end-message { text-align: center; padding: 40px 20px 50px; color: #94a3b8; font-size: 14px; font-weight: 700; display: none; }
        .end-message i { font-size: 30px; color: #cbd5e1; margin-bottom: 10px; display: block; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY)            */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, var(--brand-color), var(--navy-deep)) !important; }
        body.dark-mode .back-btn { background: rgba(255,255,255,0.1) !important; }
        
        body.dark-mode .search-container { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: 0 10px 25px rgba(0,0,0,0.5) !important; }
        body.dark-mode .search-container input { color: #f1f5f9 !important; }
        body.dark-mode .search-icon { color: var(--brand-color) !important; }
        
        body.dark-mode .filter-pill { background: #071A3A !important; border-color: #1a2c4d !important; color: #94a3b8 !important; }
        body.dark-mode .filter-pill.active { background: var(--brand-color) !important; color: white !important; border-color: var(--brand-color) !important; }
        
        body.dark-mode .product-card { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: none !important;}
        body.dark-mode .product-title { color: #f1f5f9 !important; }
        body.dark-mode .product-img-wrap { background: #0B1220 !important; }
        body.dark-mode .product-price-badge { background: rgba(11, 18, 32, 0.95) !important; color: #60a5fa !important; border: 1px solid #1a2c4d; }
        body.dark-mode .product-location { color: #94a3b8 !important; }
        
        body.dark-mode .end-message { color: #94a3b8 !important; }
        body.dark-mode .end-message i { color: #334155 !important; }
        body.dark-mode .sk-card { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #071A3A 25%, #0B1220 50%, #071A3A 75%) !important; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <!-- 🚀 NEW HERO HEADER -->
        <div class="hero-header">
            <div class="header-top-flex">
                <button onclick="window.history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h1 class="page-title">Explore Items</h1>
            </div>
            <div class="page-subtitle">Discover everything campus has to offer</div>
        </div>
        
        <!-- 🚀 FLOATING SEARCH -->
        <form class="search-container" action="#" onsubmit="return triggerSearch(event)">
            <i class="fas fa-search search-icon" onclick="triggerSearch(event)"></i>
            <input type="search" id="item-search" placeholder="Search phones, food, services...">
        </form>

        <!-- 🚀 UPGRADED PILLS -->
        <div class="cat-filter-scroll" id="category-filters">
            <div class="filter-pill active" onclick="filterByCategory('All', this)">All Items</div>
            <div class="filter-pill" onclick="filterByCategory('Gadgets', this)">Gadgets</div>
            <div class="filter-pill" onclick="filterByCategory('Fashion', this)">Fashion</div>
            <div class="filter-pill" onclick="filterByCategory('Food', this)">Food</div>
            <div class="filter-pill" onclick="filterByCategory('Transport', this)">Transport</div>
            <div class="filter-pill" onclick="filterByCategory('Beauty', this)">Beauty</div>
            <div class="filter-pill" onclick="filterByCategory('Health', this)">Health</div>
            <div class="filter-pill" onclick="filterByCategory('CampusServices', this)">Campus Services</div>
            <div class="filter-pill" onclick="filterByCategory('Professional', this)">Professional</div>
            <div class="filter-pill" onclick="filterByCategory('Tutorials', this)">Tutorials</div>
            <div class="filter-pill" onclick="filterByCategory('Books', this)">Books</div>
            <div class="filter-pill" onclick="filterByCategory('Accommodation', this)">Hostels</div>
            <div class="filter-pill" onclick="filterByCategory('Electronics', this)">Electronics</div>
        </div>

        <div class="content-area">
            
            <div class="items-grid" id="main-items-grid"></div>

            <div class="items-grid" id="skeleton-loader" style="padding-top: 12px; display: none;">
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-info"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-info"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-info"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-info"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div></div>
            </div>

            <div id="scroll-sentinel" style="height: 1px; width: 100%;"></div>

            <div class="end-message" id="end-message">
                <i class="fas fa-box-open"></i>
                You've seen all items in this category.
            </div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')">
                <i class="fas fa-plus"></i>
            </div>
            
            <a href="#" class="nav-item" onclick="requireLogin('../saved/index.html')"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/index.html')"><i class="fas fa-user"></i><span>Account</span></a>
        </div>

    </div>

    <script src="../asset/script.js"></script>

   <script>
        let allProducts = [];
        let currentDisplayList = [];
        let itemsLoaded = 0;
        const ITEMS_PER_PAGE = 50;
        let isFetchingBatch = false;
        
        let currentCategory = 'All'; 

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchMarketItems();
        });

        async function requireLogin(targetUrl) {
            if (typeof supabaseClient === 'undefined') {
                window.location.href = "../login/index.html"; return;
            }
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        async function fetchMarketItems() {
            document.getElementById('skeleton-loader').style.display = 'grid';
            
            const urlParams = new URLSearchParams(window.location.search);
            const passedCat = urlParams.get('cat');

            // 🧠 1. CACHE CHECK
            const cachedProducts = sessionStorage.getItem('items_page_data');
            
            if (cachedProducts && !passedCat) {
                allProducts = JSON.parse(cachedProducts);
                currentDisplayList = [...allProducts];
                
                const savedCount = parseInt(sessionStorage.getItem('items_loaded_count') || ITEMS_PER_PAGE);
                
                document.getElementById('skeleton-loader').style.display = 'none';
                
                renderHTMLBatch(0, savedCount);
                itemsLoaded = savedCount;
                
                observer.observe(document.getElementById('scroll-sentinel'));
                return;
            }

            // 🧠 2. FETCH FRESH
            try {
                const { data, error } = await supabaseClient
                    .from('products')
                    .select('id, name, price, category, image_urls, status, is_pinned')
                    .eq('status', 'Active')
                    .order('is_pinned', { ascending: false });

                if (error) throw error;

                const pinnedItems = data.filter(p => p.is_pinned === true);
                const unpinnedItems = shuffleArray(data.filter(p => p.is_pinned !== true));

                allProducts = [...pinnedItems, ...unpinnedItems];
                currentDisplayList = [...allProducts]; 
                
                sessionStorage.setItem('items_page_data', JSON.stringify(allProducts));
                
                if (passedCat) {
                    const pill = Array.from(document.querySelectorAll('.filter-pill')).find(p => p.innerText.includes(passedCat) || p.getAttribute('onclick').includes(`'${passedCat}'`));
                    if (pill) filterByCategory(passedCat, pill);
                } else {
                    loadNextBatch();
                }

                observer.observe(document.getElementById('scroll-sentinel'));

            } catch (error) {
                document.getElementById('skeleton-loader').style.display = 'none';
                document.getElementById('main-items-grid').innerHTML = '<p style="grid-column:span 2; text-align:center; color:red; padding: 40px;">Failed to load items.</p>';
            }
        }

        function renderHTMLBatch(startIndex, endIndex) {
            const grid = document.getElementById('main-items-grid');
            const batch = currentDisplayList.slice(startIndex, endIndex);

            const htmlStrings = batch.map(p => {
                const imgUrl = (p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://via.placeholder.com/300x300?text=No+Image';
                const multiImageBadge = (p.image_urls && p.image_urls.length > 1) ? '<div class="multi-img-badge"><i class="far fa-images"></i> ' + p.image_urls.length + '</div>' : '';
                const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(p.price);
                const pinBadge = p.is_pinned ? '<div class="pin-badge"><i class="fas fa-star"></i> Featured</div>' : '';

                return '<div class="product-card" onclick="window.location.href=\'../product/index.html?id=' + escapeJS(p.id) + '\'">' +
                            '<div class="product-img-wrap">' +
                                pinBadge +
                                '<img src="' + escapeHTML(imgUrl) + '" class="product-img" onerror="this.src=\'https://via.placeholder.com/300x300?text=No+Image\'">' +
                                multiImageBadge +
                                '<div class="product-price-badge">' + fPrice + '</div>' +
                            '</div>' +
                            '<div class="product-info">' +
                                '<div class="product-title">' + escapeHTML(p.name) + '</div>' +
                                '<div class="product-location"><i class="fas fa-layer-group" style="color: var(--brand-color);"></i> ' + escapeHTML(p.category) + '</div>' +
                            '</div>' +
                       '</div>';
            });

            grid.innerHTML += htmlStrings.join('');
        }

        function loadNextBatch() {
            if (isFetchingBatch) return;

            const grid = document.getElementById('main-items-grid');
            const skeleton = document.getElementById('skeleton-loader');
            const endMsg = document.getElementById('end-message');
            
            if (currentDisplayList.length === 0) {
                grid.innerHTML = 
                    '<div style="grid-column: span 2; text-align: center; padding: 60px 20px; color: #94a3b8;">' +
                        '<i class="fas fa-box-open" style="font-size: 50px; margin-bottom: 15px; color: #cbd5e1;"></i>' +
                        '<h3 style="font-size: 16px; color: var(--text-main); margin: 0 0 5px;">No items found</h3>' +
                        '<p style="font-size: 13px;">Try adjusting your search, category, or spelling.</p>' +
                    '</div>';
                endMsg.style.display = 'none';
                skeleton.style.display = 'none';
                return;
            }

            if (itemsLoaded >= currentDisplayList.length) return;

            isFetchingBatch = true;
            skeleton.style.display = 'grid';

            setTimeout(() => {
                skeleton.style.display = 'none';
                
                renderHTMLBatch(itemsLoaded, itemsLoaded + ITEMS_PER_PAGE);

                itemsLoaded += ITEMS_PER_PAGE;
                
                sessionStorage.setItem('items_loaded_count', itemsLoaded); 
                
                isFetchingBatch = false;

                if (itemsLoaded >= currentDisplayList.length) {
                    endMsg.style.display = 'block';
                }

            }, 600);
        }

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
                loadNextBatch();
            }
        }, { rootMargin: "100px" });

        function resetAndReload() {
            itemsLoaded = 0;
            document.getElementById('main-items-grid').innerHTML = "";
            document.getElementById('end-message').style.display = 'none';
            loadNextBatch();
        }

        function filterByCategory(categoryName, btnElement) {
            document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');

            currentCategory = categoryName;
            triggerSearch(null); 
        }

        function triggerSearch(e) {
            if (e) e.preventDefault(); 
            if (document.getElementById('item-search')) {
                document.getElementById('item-search').blur(); 
            }

            const query = document.getElementById('item-search').value.toLowerCase().trim();
            
            const filteredList = allProducts.filter(p => {
                const matchesSearchText = (p.name || '').toLowerCase().includes(query) || (p.category || '').toLowerCase().includes(query);
                const matchesCategory = (currentCategory === 'All') || (p.category === currentCategory);
                
                return matchesSearchText && matchesCategory;
            });

            const pinnedFiltered = filteredList.filter(p => p.is_pinned === true);
            const unpinnedFiltered = filteredList.filter(p => p.is_pinned !== true);
            
            currentDisplayList = [...pinnedFiltered, ...unpinnedFiltered];
            
            resetAndReload();
            return false;
        }
    </script>
</body>
</html>
