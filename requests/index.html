<head>

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
        }

        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif;}
        .app-container { min-height: 100vh; position: relative; padding-bottom: 90px;}

        /* 🚀 FLUID HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 100px 20px; /* High bottom padding for sheet overlap */
            color: white; text-align: center;
        }
        .header-top-flex { display: flex; align-items: center; justify-content: space-between; }
        .back-btn { color: white; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; backdrop-filter: blur(5px); transition: 0.2s;}
        .back-btn:active { transform: scale(0.9); }
        
        .hero-title { font-size: 24px; font-weight: 800; margin: 15px 0 5px; letter-spacing: -0.5px;}
        .hero-subtitle { font-size: 13px; color: #bae6fd; font-weight: 500; margin: 0;}

        /* 🚀 CONTINUOUS CONTENT SHEET */
        .content-sheet {
            background: white; border-radius: 40px 40px 0 0;
            padding: 65px 20px 40px; margin-top: -40px; /* Slides over the blue background */
            position: relative; z-index: 10; min-height: 50vh;
        }

        /* 🚀 FLOATING CIRCULAR ICON */
        .floating-icon {
            width: 90px; height: 90px; background: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(11,18,32,0.08); font-size: 38px; color: var(--brand-color);
            position: absolute; top: -45px; left: 50%; transform: translateX(-50%);
        }

        .request-intro { font-size: 13.5px; color: var(--text-muted); line-height: 1.6; margin-bottom: 30px; text-align: center; font-weight: 500; padding: 0 10px;}

        /* 🚀 UPGRADED FORM INPUTS */
        .form-group { margin-bottom: 22px; }
        .form-label { display: block; font-size: 12px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; padding-left: 5px;}
        
        .input-wrapper { position: relative; }
        .input-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 16px; transition: 0.2s; }
        
        .form-input { 
            width: 100%; padding: 16px 16px 16px 50px; border: 2px solid #e2e8f0; 
            border-radius: 16px; background: #F5F8FC; font-size: 14px; color: var(--text-main);
            outline: none; transition: 0.2s; box-sizing: border-box; font-family: 'Sora', sans-serif; font-weight: 500;
        }
        select.form-input { appearance: none; -webkit-appearance: none; cursor: pointer; }
        textarea.form-input { padding-left: 20px; resize: vertical; min-height: 120px; border-radius: 20px;}
        
        .form-input:focus { border-color: var(--brand-color); background: white; box-shadow: 0 4px 15px rgba(29, 94, 208, 0.1); }
        .input-wrapper:focus-within .input-icon { color: var(--brand-color); }
        
        /* Dropdown Arrow Fix */
        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            color: #94a3b8; pointer-events: none; font-size: 14px;
        }

        /* 🚀 IMAGE UPLOADER */
        .image-upload-wrapper { 
            border: 2px dashed #cbd5e1; border-radius: 20px; padding: 35px 20px; 
            text-align: center; background: #F5F8FC; cursor: pointer; margin-bottom: 15px; 
            transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .image-upload-wrapper:hover, .image-upload-wrapper:active { border-color: var(--brand-color); background: #eff6ff; }
        .image-preview { width: 100%; height: 180px; border-radius: 14px; object-fit: cover; display: none; margin-top: 15px; border: 2px solid #e2e8f0; box-shadow: 0 4px 10px rgba(11,18,32,0.05);}
        
        /* 🚀 BUTTONS & STATUS */
        .submit-btn { 
            background: var(--brand-color); color: white; border: none; width: 100%; 
            padding: 18px; border-radius: 16px; font-size: 15px; font-weight: 800; cursor: pointer; font-family: 'Sora', sans-serif; 
            transition: 0.2s; box-shadow: 0 8px 25px rgba(29, 94, 208, 0.3); display: flex; justify-content: center; align-items: center; gap: 10px;
            margin-top: 10px;
        }
        .submit-btn:active { transform: scale(0.97); box-shadow: 0 4px 12px rgba(29, 94, 208, 0.2);}
        .submit-btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

        .status-card { 
            background: #fffbeb; border: 1px solid #fde68a; color: #d97706; 
            padding: 15px 20px; border-radius: 16px; font-size: 13px; font-weight: 600; 
            margin-bottom: 25px; display: none; line-height: 1.5; align-items: flex-start; gap: 12px;
        }

        /* 🚀 ACTIVE REQUESTS BUBBLES */
        .divider { border: 0; border-top: 2px dashed #e2e8f0; margin: 40px 0 30px; }
        
        .my-list-title { margin: 0 0 20px; font-size: 18px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 8px;}
        
        .req-card { 
            background: #F5F8FC; margin-bottom: 15px; padding: 20px; border-radius: 24px; 
            border: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: flex-start; 
            transition: 0.2s;
        }
        .req-info { flex: 1; min-width: 0; padding-right: 15px;}
        .req-title { font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; line-height: 1.3;}
        .req-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px;}
        .req-budget { font-size: 14px; font-weight: 800; color: #10b981; background: #ecfdf5; display: inline-block; padding: 6px 12px; border-radius: 10px; border: 1px solid #d1fae5;}
        
        .del-btn { 
            background: white; color: #ef4444; border: 1px solid #fecaca; padding: 12px; 
            border-radius: 14px; font-size: 14px; cursor: pointer; transition: 0.2s; flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.05); display: flex; justify-content: center; align-items: center;
        }
        .del-btn:active { transform: scale(0.9); background: #fee2e2; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY THEME)      */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, var(--brand-color), var(--navy-deep)) !important; }
        body.dark-mode .back-btn { background: rgba(255,255,255,0.1) !important; }
        
        body.dark-mode .content-sheet { background: #0B1220 !important; }
        body.dark-mode .floating-icon { background: #071A3A !important; box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;}
        body.dark-mode .request-intro { color: #94a3b8 !important; }
        
        body.dark-mode .form-label { color: #f1f5f9 !important; }
        body.dark-mode .form-input { background: #071A3A !important; color: #f1f5f9 !important; border-color: #1a2c4d !important; }
        body.dark-mode .form-input:focus { border-color: var(--brand-color) !important; background: #0B1220 !important;}
        body.dark-mode .input-icon { color: #64748b !important; }
        body.dark-mode .select-wrapper::after { color: #64748b !important; }
        
        body.dark-mode .image-upload-wrapper { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .image-upload-wrapper:hover { border-color: var(--brand-color) !important; background: rgba(29, 94, 208, 0.1) !important; }
        body.dark-mode .image-upload-wrapper div { color: #94a3b8 !important; }
        
        body.dark-mode .submit-btn:disabled { background: #1a2c4d !important; color: #64748b !important; box-shadow: none !important;}
        body.dark-mode .status-card { background: rgba(245, 158, 11, 0.1) !important; border-color: rgba(245, 158, 11, 0.3) !important; color: #fcd34d !important; }
        
        body.dark-mode .divider { border-top-color: #1a2c4d !important; }
        body.dark-mode .my-list-title { color: #f1f5f9 !important; }
        
        body.dark-mode .req-card { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .req-title { color: #f1f5f9 !important; }
        body.dark-mode .req-meta { color: #94a3b8 !important; }
        body.dark-mode .req-budget { background: rgba(16, 185, 129, 0.15) !important; color: #4ade80 !important; border-color: #065f46 !important;}
        
        body.dark-mode .del-btn { background: #0B1220 !important; border-color: rgba(239, 68, 68, 0.3) !important; color: #fca5a5 !important; box-shadow: none !important;}
        body.dark-mode .del-btn:active { background: rgba(239, 68, 68, 0.2) !important; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <!-- 🚀 FLUID HERO HEADER -->
        <div class="hero-header">
            <div class="header-top-flex">
                <button onclick="window.history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <div style="width: 40px;"></div> <!-- Spacer for perfect centering -->
            </div>
            <h1 class="hero-title">Post Request</h1>
            <p class="hero-subtitle">Can't find it? Tell sellers what you need.</p>
        </div>

        <div class="content-area">
            
            <!-- 🚀 CONTINUOUS CONTENT SHEET -->
            <div class="content-sheet">
                
                <!-- Floating Circular Icon -->
                <div class="floating-icon">
                    <i class="fas fa-bullhorn"></i>
                </div>
                
                <p class="request-intro">Broadcast your specific needs to all verified vendors in the matching category instantly.</p>
                
                <div id="limit-warning" class="status-card"></div>

                <form id="requestForm" onsubmit="submitRequest(event)">
                    
                    <div class="form-group">
                        <label class="form-label">What are you looking for?</label>
                        <div class="input-wrapper">
                            <i class="fas fa-search input-icon"></i>
                            <input type="text" id="r-name" class="form-input" placeholder="e.g. Clean UK used iPhone X" required>
                        </div>
                    </div>
                    
                    <div class="form-group">

                        <div class="select-wrapper input-wrapper">

                            <select id="r-cat" class="form-input" required>
                                <option value="" disabled selected>Select Category</option>
                                <option value="Gadgets">Gadgets & Tech</option>
                                <option value="Fashion">Fashion & Clothing</option>
                                <option value="Food">Food & Pastries</option>
                                <option value="Transport">Transport & Delivery</option>
                                <option value="Beauty">Beauty & Personal Care</option>
                                <option value="Health">Health & Wellness</option>
                                <option value="CampusServices">Campus Services</option>
                                <option value="Professional">Professional Services</option>
                                <option value="Tutorials">Tutorials & Learning</option>
                                <option value="Books">Books & Materials</option>

                    <div class="form-group">

                    <div class="form-group">
                        <label class="form-label">Add a Reference Image (Optional)</label>
                        <div class="image-upload-wrapper" onclick="document.getElementById('r-image').click()">
                            <i class="fas fa-cloud-upload-alt" style="font-size: 38px; color: var(--brand-color); margin-bottom: 12px;"></i>
                            <div style="font-size: 14px; color: var(--text-muted); font-weight: 700;">Tap to upload an image</div>
                            <input type="file" id="r-image" accept="image/*" style="display: none;" onchange="previewImage(event)">
                            <img id="img-preview" class="image-preview" src="">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="submit-btn"><i class="fas fa-paper-plane"></i> Broadcast to Vendors</button>
                </form>

                <hr class="divider">

                <!-- 🚀 ACTIVE REQUESTS BUBBLES -->
                <div class="my-list-title"><i class="fas fa-history" style="color: var(--brand-color);"></i> My Active Requests</div>
                <div id="my-requests-list"></div>

            </div>
        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')"><i class="fas fa-plus"></i></div>
            <a href="#" class="nav-item" onclick="requireLogin('../saved/index.html')"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="../account/index.html" class="nav-item"><i class="fas fa-user"></i><span>Account</span></a>
        </div>
    </div>

    <script src="../asset/script.js"></script>

    <script>
        const EMAILJS_PUBLIC_KEY = 'O7rbWSysI2B0z1LU7';
        const EMAILJS_SERVICE_ID = 'service_8u7t6p1';
        const EMAILJS_TEMPLATE_ID = 'template_17znkwl';

        const CLOUDINARY_URL = 'https://api.cloudinary.com/v1_1/dgsblxgni/image/upload';
        const CLOUDINARY_PRESET = 'afit_media';

        emailjs.init(EMAILJS_PUBLIC_KEY);

        let currentUser = null;
        let selectedFile = null;

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "../login/index.html"; return; }
            currentUser = session.user;
            
            checkLimitsAndLoad();
        });

        async function requireLogin(targetUrl) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('img-preview');
                    img.src = e.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function compressImage(file, maxWidth = 800, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width; let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width; canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".jpg", { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        async function uploadToCloudinary(file) {
            const compressedFile = await compressImage(file);
            const formData = new FormData();
            formData.append('file', compressedFile);
            formData.append('upload_preset', CLOUDINARY_PRESET);
            
            const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
            const data = await res.json();
            return data.secure_url;
        }

        async function checkLimitsAndLoad() {
            const list = document.getElementById('my-requests-list');
            const warning = document.getElementById('limit-warning');
            const btn = document.getElementById('submitBtn');
            
            list.innerHTML = "<p style='text-align:center; font-size:14px; color:#94a3b8; font-weight:600; padding: 20px;'><i class='fas fa-spinner fa-spin' style='color: var(--brand-color);'></i> Loading...</p>";

            try {
                const { data, error } = await supabaseClient
                    .from('requests')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const activeRequests = data.filter(r => r.status === 'Active');
                let canPostTime = true;
                let hoursLeft = 0;
                
                if (data.length > 0) {
                    const lastPostDate = new Date(data[0].created_at).getTime();
                    const now = new Date().getTime();
                    const diffHours = (now - lastPostDate) / (1000 * 60 * 60);
                    
                    if (diffHours < 24) {
                        canPostTime = false;
                        hoursLeft = Math.ceil(24 - diffHours);
                    }
                }

                if (activeRequests.length >= 2) {
                    warning.innerHTML = "<i class='fas fa-exclamation-triangle' style='font-size: 20px;'></i> <div>You have reached the maximum limit of 2 active requests. Please delete one before posting a new one.</div>";
                    warning.style.display = "flex";
                    btn.disabled = true;
                } else if (!canPostTime) {
                    warning.innerHTML = "<i class='fas fa-clock' style='font-size: 20px;'></i> <div>You can only post one request every 24 hours to prevent spam. You can post again in <b>" + hoursLeft + " hours</b>.</div>";
                    warning.style.display = "flex";
                    btn.disabled = true;
                } else {
                    warning.style.display = "none";
                    btn.disabled = false;
                }

                if (activeRequests.length === 0) {
                    list.innerHTML = "<div style='text-align:center; padding: 20px;'><i class='fas fa-box-open' style='font-size: 35px; color: #cbd5e1; margin-bottom: 12px;'></i><p style='font-size:13px; color:#94a3b8; font-weight:600; margin:0;'>You have no active requests.</p></div>";
                    return;
                }

                const htmlStrings = activeRequests.map(r => {
                    const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(r.budget);
                    
                    return '<div class="req-card">' +
                                '<div class="req-info">' +
                                    '<div class="req-title">' + escapeHTML(r.product_name) + '</div>' +
                                    '<div class="req-meta"><i class="fas fa-layer-group" style="color: var(--brand-color);"></i> ' + escapeHTML(r.category) + '</div>' +
                                    '<div class="req-budget">Budget: ' + fPrice + '</div>' +
                                '</div>' +
                                '<button class="del-btn" onclick="deleteRequest(\'' + escapeJS(r.id) + '\')"><i class="fas fa-trash"></i></button>' +
                           '</div>';
                });

                list.innerHTML = htmlStrings.join('');

            } catch (e) {
                console.error(e);
                list.innerHTML = "<p style='text-align:center; font-size:14px; color:#ef4444; font-weight:600; padding: 20px;'>Error loading requests.</p>";
            }
        }

        async function submitRequest(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.disabled = true;

            try {
                let uploadedImageUrl = null;
                if (selectedFile) {
                    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading Image...';
                    uploadedImageUrl = await uploadToCloudinary(selectedFile);
                }

                const reqData = {
                    user_id: currentUser.id,
                    product_name: document.getElementById('r-name').value.trim(),
                    category: document.getElementById('r-cat').value,
                    budget: document.getElementById('r-budget').value,
                    description: document.getElementById('r-desc').value.trim(),
                    image_url: uploadedImageUrl 
                };

                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving Request...';
                
                const { error: insertErr } = await supabaseClient.from('requests').insert([reqData]);
                if (insertErr) throw insertErr;

                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Notifying Vendors...';
                
                const { data: vendors } = await supabaseClient
                    .from('vendors')
                    .select('email')
                    .eq('is_active', true)
                    .ilike('categories', '%' + reqData.category + '%');

                if (vendors && vendors.length > 0) {
                    const emailList = vendors.map(v => v.email).filter(e => e).join(','); 
                    
                    const templateParams = {
                        product_name: reqData.product_name,
                        category: reqData.category,
                        budget: "₦" + Number(reqData.budget).toLocaleString(),
                        description: reqData.description,
                        vendor_emails: emailList 
                    };

                    emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams).catch(() => {}); 
                }

                alert("Request posted successfully!");
                document.getElementById('requestForm').reset();
                document.getElementById('img-preview').style.display = 'none';
                selectedFile = null;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Broadcast to Vendors';
                
                checkLimitsAndLoad(); 

            } catch (error) {
                alert("Failed to post request.");
                console.error(error);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Broadcast to Vendors';
            }
        }

        window.deleteRequest = async function(reqId) {
            if(!confirm("Are you sure you want to remove this request?")) return;
            try {
                await supabaseClient.from('requests').update({ status: 'Deleted' }).eq('id', reqId);
                checkLimitsAndLoad(); 
            } catch(e) {
                alert("Failed to delete.");
            }
        }
    </script>
</body>
</html>
