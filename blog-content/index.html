<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-70VSGR5WBW"></script>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Article | BRYT DGM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../asset/img/bryt-app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
            --bg-body: #F5F8FC;
        }

        body, html { background: var(--bg-body); margin: 0; padding: 0; font-family: 'Sora', sans-serif; overflow-x: hidden;}
        .app-container { min-height: 100vh; position: relative; }
        
        /* 🚀 TOP NAVIGATION */
        .glass-header {
            position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; 
            background: linear-gradient(to bottom, rgba(11,18,32,0.7) 0%, transparent 100%);
            border: none; padding: 20px; z-index: 100; pointer-events: none;
            display: flex; justify-content: space-between; align-items: center; box-sizing: border-box;
        }
        .header-btn {
            background: rgba(255,255,255,0.25); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1); width: 42px; height: 42px; border-radius: 50%; 
            color: white; font-size: 18px; cursor: pointer; display: flex; justify-content: center; align-items: center;
            pointer-events: auto; transition: 0.2s; box-shadow: 0 4px 15px rgba(11,18,32,0.1);
        }
        .header-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.4); }

        /* 🚀 HERO IMAGE */
        .article-hero { width: 100%; height: 320px; object-fit: cover; background: #e2e8f0; display: block;}
        
        /* 🚀 PREMIUM BLOG BODY */
        .article-body { 
            padding: 35px 20px; background: white; margin-top: -30px; position: relative; 
            border-radius: 30px 30px 0 0; z-index: 10; box-shadow: 0 -5px 25px rgba(11,18,32,0.06);
        }
        
        .cat-badge { 
            display: inline-block; color: var(--brand-color); background: rgba(29, 94, 208, 0.1); 
            padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 800; 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px;
        }
        
        .article-title { font-size: 24px; font-weight: 800; color: var(--text-main); margin: 0 0 20px; line-height: 1.3; letter-spacing: -0.5px;}
        
        /* Professional Author Meta Row */
        .article-meta { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 30px; border-bottom: 1px solid #f1f5f9; padding-bottom: 20px;
        }
        .meta-left { display: flex; align-items: center; gap: 12px; }
        .meta-avatar { 
            width: 40px; height: 40px; border-radius: 50%; background: var(--brand-color); 
            color: white; display: flex; justify-content: center; align-items: center; font-size: 18px; 
            box-shadow: 0 4px 10px rgba(29, 94, 208, 0.3);
        }
        .meta-info { display: flex; flex-direction: column; }
        .meta-author { font-size: 14px; font-weight: 800; color: var(--text-main); }
        .meta-date { font-size: 12px; color: var(--text-muted); font-weight: 500; }
        .meta-views { font-size: 12px; font-weight: 700; color: var(--text-muted); background: #f5f8fc; padding: 6px 12px; border-radius: 12px;}
        
        /* Formatted Article Content */
        .article-content { font-size: 15px; color: #334155; line-height: 1.8; white-space: pre-wrap; margin-bottom: 40px; font-family: 'Sora', sans-serif;}
        .article-content a { word-break: break-word; color: var(--brand-color); text-decoration: underline; font-weight: 700;} 
        
        /* 🚀 COMMENTS SECTION */
        .comments-section { border-top: 6px solid #f5f8fc; padding-top: 30px; }
        .comments-title { font-size: 18px; font-weight: 800; margin-bottom: 20px; color: var(--text-main); }
        .comment-card { display: flex; gap: 12px; margin-bottom: 20px; }
        .comment-avatar { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: #eee; border: 2px solid #f5f8fc;}
        .comment-bubble { background: #f5f8fc; padding: 16px; border-radius: 0 16px 16px 16px; flex: 1; border: 1px solid #e2e8f0; }
        .comment-name { font-size: 14px; font-weight: 800; color: var(--text-main); margin-bottom: 5px; }
        .comment-text { font-size: 13px; color: var(--text-muted); line-height: 1.5;}

        .add-comment-box { display: flex; gap: 10px; margin-top: 20px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        .comment-input { 
            flex: 1; min-width: 0; box-sizing: border-box; padding: 15px; 
            border-radius: 16px; border: 2px solid #e2e8f0; background: #f5f8fc; 
            outline: none; font-size: 14px; transition: 0.2s; font-family: 'Sora', sans-serif;
        }
        .comment-input:focus { border-color: var(--brand-color); background: white; box-shadow: 0 4px 15px rgba(29, 94, 208, 0.1);}
        .send-btn { 
            background: var(--brand-color); color: white; border: none; width: 50px; 
            height: 50px; border-radius: 16px; display: flex; justify-content: center; 
            align-items: center; cursor: pointer; font-size: 18px; 
            box-shadow: 0 4px 15px rgba(29, 94, 208, 0.3); flex-shrink: 0; transition: 0.2s;
        }
        .send-btn:active { transform: scale(0.9); }

        /* 🚀 MORE BLOGS SECTION */
        .more-blogs-section { background: #f5f8fc; padding: 35px 20px 40px; }
        .section-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin-bottom: 20px; display: flex; align-items: center; gap: 8px;}
        
        .small-blog-card { 
            background: white; border-radius: 16px; padding: 12px; display: flex; gap: 15px; 
            margin-bottom: 15px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(11,18,32,0.02); 
            cursor: pointer; transition: 0.2s; align-items: center;
        }
        .small-blog-card:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(11,18,32,0.02);}
        .small-blog-card img { width: 85px; height: 85px; border-radius: 12px; object-fit: cover; background: #f5f8fc;}
        .sbc-info { flex: 1; min-width: 0; }
        .sbc-title { font-size: 14px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .sbc-meta { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: flex; gap: 8px; align-items: center;}

        /* 🚀 SKELETON LOADER STYLES */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-hero { width: 100%; height: 320px; }
        .sk-badge { width: 60px; height: 22px; border-radius: 12px; margin-bottom: 15px; }
        .sk-title { width: 90%; height: 30px; border-radius: 8px; margin-bottom: 10px; }
        .sk-title-2 { width: 70%; height: 30px; border-radius: 8px; margin-bottom: 25px; }
        .sk-meta { width: 100%; height: 40px; border-radius: 12px; margin-bottom: 30px; }
        .sk-text { width: 100%; height: 16px; border-radius: 4px; margin-bottom: 12px; }
        .sk-text-short { width: 80%; height: 16px; border-radius: 4px; margin-bottom: 12px; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY)            */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .article-body { background: #0B1220 !important; }
        body.dark-mode .article-title { color: #f1f5f9 !important; }
        body.dark-mode .meta-author { color: #f1f5f9 !important; }
        body.dark-mode .meta-views { background: #071A3A !important; color: #cbd5e1 !important; }
        body.dark-mode .article-meta { border-bottom-color: #1a2c4d !important; }
        body.dark-mode .article-content { color: #cbd5e1 !important; }
        
        body.dark-mode .comments-section { border-top-color: #071A3A !important; }
        body.dark-mode .comments-title { color: #f1f5f9 !important; }
        body.dark-mode .comment-bubble { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .comment-name { color: #f1f5f9 !important; }
        body.dark-mode .comment-text { color: #94a3b8 !important; }
        
        body.dark-mode .comment-input { background: #071A3A !important; border-color: #1a2c4d !important; color: white; }
        body.dark-mode .comment-input:focus { border-color: var(--brand-color) !important; }
        
        body.dark-mode .more-blogs-section { background: #071A3A !important; }
        body.dark-mode .section-title { color: #f1f5f9 !important; }
        body.dark-mode .small-blog-card { background: #0B1220 !important; border-color: #1a2c4d !important; box-shadow: none !important;}
        body.dark-mode .sbc-title { color: #f1f5f9 !important; }
        
        body.dark-mode .cat-badge { background: rgba(29, 94, 208, 0.15) !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #071A3A 25%, #0B1220 50%, #071A3A 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <!-- Transparent Floating Header -->
        <div class="glass-header">
            <button onclick="smartBack()" class="header-btn"><i class="fas fa-arrow-left"></i></button>
            <button id="shareTopBtn" class="header-btn" style="display: none;"><i class="fas fa-share-alt"></i></button>
        </div>

        <div id="skeleton-content">
            <div class="sk-shimmer sk-hero"></div>
            <div class="article-body">
                <div class="sk-shimmer sk-badge"></div>
                <div class="sk-shimmer sk-title"></div>
                <div class="sk-shimmer sk-title-2"></div>
                <div class="sk-shimmer sk-meta"></div>
                
                <div class="sk-shimmer sk-text"></div>
                <div class="sk-shimmer sk-text"></div>
                <div class="sk-shimmer sk-text"></div>
                <div class="sk-shimmer sk-text-short"></div>
                <div style="height: 20px;"></div>
                <div class="sk-shimmer sk-text"></div>
                <div class="sk-shimmer sk-text-short"></div>
            </div>
        </div>

        <div id="real-content" style="display: none;">
            <img src="" id="articleImg" class="article-hero" onerror="this.src='https://placehold.co/600x300?text=No+Image'">

            <div class="article-body">
                <span class="cat-badge" id="articleCat">News</span>
                <h1 class="article-title" id="articleTitle">Loading Article...</h1>
                
                <!-- Premium Author Meta Block -->
                <div class="article-meta">
                    <div class="meta-left">
                        <div class="meta-avatar"><i class="fas fa-newspaper"></i></div>
                        <div class="meta-info">
                            <span class="meta-author">BRYT News Desk</span>
                            <span class="meta-date" id="articleDate">--</span>
                        </div>
                    </div>
                    <div class="meta-views" id="articleViews"><i class="far fa-eye"></i> --</div>
                </div>

                <div class="article-content" id="articleContent"></div>

                <div class="comments-section">
                    <h3 class="comments-title">Comments</h3>
                    
                    <div id="commentsList">
                        <p style="color: #94a3b8; font-size: 13px; text-align: center;"><i class="fas fa-spinner fa-spin"></i> Loading comments...</p>
                    </div>

                    <div class="add-comment-box">
                        <input type="text" id="commentInput" class="comment-input" placeholder="Share your thoughts...">
                        <button class="send-btn" onclick="postComment()"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
            
            <div class="more-blogs-section">
                <h3 class="section-title"><i class="fas fa-fire" style="color: #ea580c;"></i> Recommended Reads</h3>
                <div id="more-blogs-list">
                    <p style="color: #94a3b8; font-size: 13px;">Loading more posts...</p>
                </div>
            </div>
        </div>

    </div>

    <script src="../asset/script.js"></script>

    <script>
        let currentUser = null;
        let currentBlogId = null;
        let blogData = null;

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        window.smartBack = function() {
            if (document.referrer === "" || document.referrer.includes('wa.me') || !document.referrer.includes(window.location.host)) {
                window.location.href = "../index.html"; 
            } else {
                window.history.back(); 
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) currentUser = session.user;
            
            loadArticle();
        });

        function createSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        }

        function linkifyText(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return '<a href="' + escapeHTML(url) + '" target="_blank">' + escapeHTML(url) + '</a>';
            });
        }

        async function loadArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const postParam = urlParams.get('post') || urlParams.get('id'); 
            
            if (!postParam) {
                document.getElementById('skeleton-content').style.display = 'none';
                document.getElementById('real-content').style.display = 'block';
                document.getElementById('articleTitle').innerText = "Article Not Found";
                return;
            }

            currentBlogId = postParam.includes('--') ? postParam.split('--').pop() : postParam;

            try {
                const { data, error } = await supabaseClient
                    .from('blogs')
                    .select('*')
                    .eq('id', currentBlogId)
                    .single();

                if (error) throw error;
                blogData = data;

                const niceSlug = createSlug(data.title);
                window.history.replaceState(null, '', '?post=' + niceSlug + '--' + data.id);

                document.title = data.title + ' | BRYT DGM News';
                
                document.getElementById('articleImg').src = data.image_url || 'https://placehold.co/600x300?text=No+Image';
                document.getElementById('articleCat').innerText = escapeHTML(data.category || 'News');
                document.getElementById('articleTitle').innerText = escapeHTML(data.title);
                
                const dateObj = new Date(data.created_at);
                document.getElementById('articleDate').innerText = dateObj.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
                
                const safeContent = escapeHTML(data.content);
                const textWithLinks = linkifyText(safeContent);
                document.getElementById('articleContent').innerHTML = textWithLinks.replace(/\n/g, '<br>');

                const shareBtn = document.getElementById('shareTopBtn');
                shareBtn.style.display = 'flex';
                shareBtn.onclick = () => shareBlog(data.id, data.title, data.snippet);

                const sessionViews = JSON.parse(sessionStorage.getItem('session_viewed_blogs') || '[]');
                if (!sessionViews.includes(currentBlogId)) {
                    sessionViews.push(currentBlogId);
                    sessionStorage.setItem('session_viewed_blogs', JSON.stringify(sessionViews));
                    
                    document.getElementById('articleViews').innerHTML = '<i class="far fa-eye"></i> ' + ((data.views || 0) + 1);
                    
                    const { data: latestDb } = await supabaseClient.from('blogs').select('views').eq('id', currentBlogId).single();
                    if (latestDb) {
                        const safeNewCount = Math.max((data.views || 0) + 1, (latestDb.views || 0) + 1);
                        await supabaseClient.from('blogs').update({ views: safeNewCount }).eq('id', currentBlogId);
                    }
                } else {
                    document.getElementById('articleViews').innerHTML = '<i class="far fa-eye"></i> ' + (data.views || 0);
                }

                document.getElementById('skeleton-content').style.display = 'none';
                document.getElementById('real-content').style.display = 'block';

                loadComments();
                loadMoreBlogs();

            } catch (err) {
                console.error(err);
                document.getElementById('skeleton-content').style.display = 'none';
                document.getElementById('real-content').style.display = 'block';
                document.getElementById('articleTitle').innerText = "Error loading article.";
            }
        }

        async function loadComments() {
            const list = document.getElementById('commentsList');
            try {
                const { data, error } = await supabaseClient
                    .from('blog_comments')
                    .select('comment_text, created_at, profiles(full_name, avatar_url)')
                    .eq('blog_id', currentBlogId)
                    .order('created_at', { ascending: true });

                if (error) throw error;
                list.innerHTML = "";

                if (data.length === 0) {
                    list.innerHTML = '<p style="font-size:13px; color:#94a3b8; text-align: center; padding: 20px;">No comments yet. Be the first to share your thoughts!</p>';
                    return;
                }

                const htmlStrings = data.map(c => {
                    const name = escapeHTML(c.profiles?.full_name || "Student");
                    const avatar = escapeHTML(c.profiles?.avatar_url || "../img/person.png");
                    const text = escapeHTML(c.comment_text);
                    
                    return '<div class="comment-card">' +
                                '<img src="' + avatar + '" class="comment-avatar" onerror="this.src=\'../img/person.png\'">' +
                                '<div class="comment-bubble">' +
                                    '<div class="comment-name">' + name + '</div>' +
                                    '<div class="comment-text">' + text + '</div>' +
                                '</div>' +
                           '</div>';
                });

                list.innerHTML = htmlStrings.join('');
            } catch (err) {
                list.innerHTML = '<p style="color:red; font-size:13px;">Failed to load comments.</p>';
            }
        }

        window.postComment = async function() {
            if (!currentUser) {
                alert("Please log in to comment.");
                window.location.href = "../login/index.html?redirect=" + encodeURIComponent(window.location.href);
                return;
            }
            
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text || !currentBlogId) return;

            input.value = "Posting..."; 
            input.disabled = true;

            try {
                await supabaseClient.from('blog_comments').insert([{ blog_id: currentBlogId, user_id: currentUser.id, comment_text: text }]);
                input.value = ""; 
                loadComments(); 
            } catch (error) {
                alert("Failed to post comment."); 
                input.value = text; 
            } finally { 
                input.disabled = false; 
            }
        }

        async function loadMoreBlogs() {
            const list = document.getElementById('more-blogs-list');
            try {
                const { data, error } = await supabaseClient
                    .from('blogs')
                    .select('id, title, category, image_url, created_at')
                    .neq('id', currentBlogId)
                    .order('created_at', { ascending: false })
                    .limit(50); 

                if (error) throw error;
                list.innerHTML = "";

                if (!data || data.length === 0) {
                    list.innerHTML = '<p style="font-size:13px; color:#94a3b8;">No other articles found.</p>';
                    return;
                }

                for (let i = data.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [data[i], data[j]] = [data[j], data[i]];
                }
                const shuffled = data.slice(0, 10);

                const htmlStrings = shuffled.map(b => {
                    const slug = createSlug(b.title);
                    const img = escapeHTML(b.image_url || 'https://placehold.co/100x100?text=No+Image');
                    const date = new Date(b.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

                    return '<div class="small-blog-card" onclick="window.location.href=\'index.html?post=' + escapeJS(slug) + '--' + escapeJS(b.id) + '\'">' +
                                '<img src="' + img + '" onerror="this.src=\'https://placehold.co/100x100?text=No+Image\'">' +
                                '<div class="sbc-info">' +
                                    '<div class="sbc-title">' + escapeHTML(b.title) + '</div>' +
                                    '<div class="sbc-meta"><span style="color: var(--brand-color);">' + escapeHTML(b.category) + '</span> &bull; ' + date + '</div>' +
                                '</div>' +
                           '</div>';
                });

                list.innerHTML = htmlStrings.join('');

            } catch (err) {
                list.innerHTML = '';
            }
        }

        window.shareBlog = function(blogId, title, snippet) {
            const slug = createSlug(title);
            const baseUrl = window.location.href.split('?')[0]; 
            const shareUrl = baseUrl + '?post=' + slug + '--' + blogId;
            const safeSnippet = snippet ? snippet : 'Read the latest update on BRYT DGM.';
            
            const shareText = '*' + title + '*\n\n' + safeSnippet + '\n\nRead the full article:\n' + shareUrl;

            if (navigator.share) {
                navigator.share({
                    title: "BRYT DGM News",
                    text: '*' + title + '*\n' + safeSnippet + '\n\nRead the full article on BRYT DGM:',
                    url: shareUrl
                }).catch(err => console.log('Share cancelled', err));
            } else {
                const waUrl = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(shareText);
                window.open(waUrl, '_blank');
            }
        }
    </script>
</body>
</html>
