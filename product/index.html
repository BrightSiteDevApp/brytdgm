<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-70VSGR5WBW"></script>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Item Details | BRYT DGM</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../asset/img/bryt-app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 4px 15px rgba(11, 18, 32, 0.03);
        }

        /* --- PRODUCT PAGE STYLES --- */
        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif;}
        .app-container { padding-bottom: 90px; min-height: 100vh; background: #F5F8FC; } 

        /* 🚀 STICKY TRANSPARENT HEADER */
        .header { 
            background: rgba(255, 255, 255, 0.95); padding: 15px 20px; position: sticky; top: 0; z-index: 1000; 
            backdrop-filter: blur(10px); box-shadow: 0 2px 15px rgba(11, 18, 32, 0.03); 
        }
        .header-flex { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .header-title-group { display: flex; align-items: center; gap: 15px; }
        .page-title { font-size: 18px; font-weight: 800; color: var(--text-main); margin: 0; letter-spacing: -0.3px;}

        .action-icon-btn {
            background: #F5F8FC; color: var(--text-main); width: 40px; height: 40px; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            border: none; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .action-icon-btn:active { transform: scale(0.9); background: #e2e8f0; }

        /* 🚀 REDESIGNED IMAGE CAROUSEL */
        .carousel-container { position: relative; width: 100%; height: 360px; background: var(--text-main); border-radius: 0 0 30px 30px; overflow: hidden; }
        .image-slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; height: 100%; scroll-behavior: smooth; }
        .image-slider::-webkit-scrollbar { display: none; }
        .slide-img { width: 100%; height: 100%; object-fit: cover; flex-shrink: 0; scroll-snap-align: center; }

        .carousel-dots { position: absolute; bottom: 40px; left: 0; width: 100%; display: flex; justify-content: center; gap: 6px; z-index: 10;}
        .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); transition: 0.3s; }
        .dot.active { background: white; width: 24px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.3);}

        /* 🚀 FLOATING PRODUCT INFO BOX */
        .product-info-box { 
            background: white; padding: 25px 20px; border-radius: 24px; box-shadow: 0 10px 30px rgba(11, 18, 32, 0.05); 
            margin: -30px 20px 20px; position: relative; z-index: 20; border: 1px solid #e2e8f0;
        }
        .p-category { display: inline-block; background: #eff6ff; color: var(--brand-color); font-size: 11px; font-weight: 800; padding: 6px 12px; border-radius: 8px; text-transform: uppercase; margin-bottom: 12px; }
        .p-title { font-size: 20px; font-weight: 800; color: var(--text-main); margin-bottom: 8px; line-height: 1.3; }
        .p-price { font-size: 28px; font-weight: 800; color: var(--brand-color); margin-bottom: 15px; }

        .section-title { font-size: 16px; font-weight: 800; color: var(--text-main); margin: 25px 20px 12px; display: flex; align-items: center; gap: 8px; }

        .p-desc-wrapper { padding: 0 20px; margin-bottom: 25px; }
        .p-desc { font-size: 14px; color: #475569; line-height: 1.6; white-space: pre-wrap; background: white; padding: 18px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: var(--shadow-sm); font-weight: 500;}

        /* 🚀 VENDOR CARD */
        .vendor-wrapper { padding: 0 20px; margin-bottom: 30px; }
        .vendor-strip { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 16px; padding: 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; }
        .vendor-strip:active { transform: scale(0.98); }
        .v-logo { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 3px solid white; box-shadow: 0 4px 10px rgba(29, 94, 208, 0.15); background: #F5F8FC; }
        .v-info { flex: 1; margin: 0 15px; min-width: 0; }
        .v-name { font-size: 15px; font-weight: 800; color: var(--brand-color); margin-bottom: 3px; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .v-cat { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .v-btn { font-size: 12px; font-weight: 800; font-family: 'Sora', sans-serif; color: white; background: var(--brand-color); padding: 8px 14px; border-radius: 10px; flex-shrink: 0; box-shadow: 0 4px 10px rgba(29, 94, 208, 0.3);}

        /* 🚀 DYNAMIC RECOMMENDATION SLIDERS */
        .section-header-flex { display: flex; justify-content: space-between; align-items: center; margin: 35px 20px 12px; }
        .section-header-title { font-size: 16px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; margin: 0; }
        .section-header-link { font-size: 12px; color: var(--brand-color); font-weight: 700; text-decoration: none; }

        .mini-slider {
            display: flex; overflow-x: auto; gap: 12px; padding: 0 20px 10px;
            scroll-snap-type: x mandatory; scrollbar-width: none; scroll-behavior: smooth;
        }
        .mini-slider::-webkit-scrollbar { display: none; }

        .mini-card {
            width: 130px; flex-shrink: 0; scroll-snap-align: start; margin-bottom: 0;
            background: var(--bg-card); border-radius: 16px; padding: 10px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color);
            display: flex; flex-direction: column; cursor: pointer; transition: transform 0.2s;
        }
        .mini-card:active { transform: scale(0.96); }
        .mini-img { width: 100%; height: 105px; object-fit: cover; border-radius: 10px; margin-bottom: 8px; background: #F5F8FC; }
        .mini-price { font-size: 14px; font-weight: 800; color: var(--brand-color); margin-bottom: 3px; }
        .mini-title { font-size: 11px; font-weight: 600; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 🚀 VENDOR MINI CARD */
        .vendor-mini-card { 
            width: 120px; flex-shrink: 0; scroll-snap-align: start; margin-bottom: 0;
            background: white; border-radius: 16px; padding: 15px 10px; text-align: center; 
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; transition: 0.2s; 
        }
        .vendor-mini-card:active { transform: scale(0.96); }
        .vendor-mini-img { width: 60px; height: 60px; border-radius: 50%; margin-bottom: 10px; border: 2px solid #e2e8f0; object-fit: cover; }
        .vendor-mini-name { font-size: 12px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; display: block; text-transform: uppercase;}

        .view-all-btn { display: block; text-align: center; background: white; color: var(--brand-color); padding: 15px; border-radius: 16px; font-weight: 800; font-size: 14px; text-decoration: none; margin: 15px 20px 5px; border: 1px solid var(--border-color); transition: 0.2s; box-shadow: var(--shadow-sm); }
        .view-all-btn:active { transform: scale(0.98); background: #F5F8FC; }

        /* 🚀 BOTTOM ACTION BAR */
        .fixed-bottom-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px); padding: 15px 20px; display: flex; gap: 12px; box-shadow: 0 -10px 30px rgba(11, 18, 32, 0.06); z-index: 1000; border-top: 1px solid #e2e8f0; border-radius: 30px 30px 0 0; box-sizing: border-box;}
        .action-btn { flex: 1; padding: 16px; border: none; border-radius: 16px; font-weight: 800; font-family: 'Sora', sans-serif; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; }
        .action-btn:active { transform: scale(0.96); }
        .btn-whatsapp { background: #25D366; color: white; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-chat { background: var(--brand-color); color: white; box-shadow: 0 4px 15px rgba(29, 94, 208, 0.3); }

        /* 🚀 SKELETONS */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 8px;}
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* ========================================= */
        /* 🌙 DARK MODE OVERRIDES (BRYT NAVY THEME)  */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        body.dark-mode .header { background: rgba(11, 18, 32, 0.95) !important; border-bottom: 1px solid #1a2c4d !important; box-shadow: none !important;}
        body.dark-mode .page-title, body.dark-mode .fa-arrow-left { color: #f1f5f9 !important; }
        body.dark-mode .action-icon-btn { background: #071A3A !important; color: #f1f5f9 !important; }

        body.dark-mode .carousel-container { background: #071A3A !important; }
        body.dark-mode .product-info-box { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .p-title { color: #f1f5f9 !important; }
        body.dark-mode .p-category { background: #0B1220 !important; color: var(--brand-hover) !important; border: 1px solid #1a2c4d; }

        body.dark-mode .section-title, body.dark-mode .section-header-title { color: #f1f5f9 !important; }
        body.dark-mode .p-desc { background: #071A3A !important; color: #cbd5e1 !important; border-color: #1a2c4d !important; }

        body.dark-mode .vendor-strip { background: #0B1220 !important; border-color: #1a2c4d !important; }
        body.dark-mode .v-logo { border-color: #071A3A !important; }
        body.dark-mode .v-name { color: #60a5fa !important; }
        body.dark-mode .v-btn { background: var(--brand-color) !important; color: white !important;}

        body.dark-mode .mini-card { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: none !important;}
        body.dark-mode .mini-img { background: #0B1220 !important; }
        body.dark-mode .mini-title { color: #f1f5f9 !important; }

        body.dark-mode .vendor-mini-card { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: none !important;}
        body.dark-mode .vendor-mini-name { color: #f1f5f9 !important; }
        body.dark-mode .vendor-mini-img { border-color: #071A3A !important; }

        body.dark-mode .view-all-btn { background: #071A3A !important; color: #f1f5f9 !important; border-color: #1a2c4d !important; }
        body.dark-mode .view-all-btn:active { background: #1a2c4d !important; }

        body.dark-mode .fixed-bottom-bar { background: rgba(11, 18, 32, 0.95) !important; border-top-color: #1a2c4d !important; box-shadow: 0 -10px 30px rgba(0,0,0,0.5) !important;}
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #071A3A 25%, #0B1220 50%, #071A3A 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">

        <div class="header">
            <div class="header-flex">
                <div class="header-title-group">
                    <button class="action-icon-btn" onclick="smartBack()" style="border-radius: 50%;"><i class="fas fa-arrow-left"></i></button>
                    <h1 class="page-title">Item Details</h1>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="action-icon-btn" style="border-radius: 50%;" onclick="shareItem()"><i class="fas fa-share-alt"></i></button>
                    <button class="action-icon-btn" style="border-radius: 50%;" id="save-btn" onclick="toggleSave()"><i class="far fa-heart"></i></button>
                </div>
            </div>
        </div>

        <div id="loader-state">
            <div class="sk-shimmer" style="width: 100%; height: 360px; border-radius: 0 0 30px 30px;"></div>
            <div style="background: white; padding: 25px 20px; border-radius: 24px; margin: -30px 20px 20px; position: relative; z-index: 20; border: 1px solid #e2e8f0;">
                <div class="sk-shimmer" style="width: 30%; height: 25px; margin-bottom: 12px;"></div>
                <div class="sk-shimmer" style="width: 80%; height: 30px; margin-bottom: 10px;"></div>
                <div class="sk-shimmer" style="width: 50%; height: 35px;"></div>
            </div>
        </div>

        <div id="content-state" style="display: none;">

            <div class="carousel-container">
                <div class="image-slider" id="image-gallery" onscroll="updateDots()"></div>
                <div class="carousel-dots" id="carousel-dots"></div>
            </div>

            <div class="product-info-box">
                <div class="p-category" id="display-category">Category</div>
                <h1 class="p-title" id="display-title">Loading...</h1>
                <div class="p-price" id="display-price">₦0</div>
            </div>

            <div class="section-title"><i class="fas fa-align-left" style="color: var(--brand-color);"></i> Description</div>
            <div class="p-desc-wrapper">
                <div class="p-desc" id="display-desc">...</div>
            </div>

            <div class="section-title"><i class="fas fa-store" style="color: #10b981;"></i> Sold By</div>
            <div class="vendor-wrapper">
                <div class="vendor-strip" id="vendor-btn">
                    <img src="" id="v-logo" class="v-logo" onerror="this.src='https://via.placeholder.com/150'">
                    <div class="v-info">
                        <div class="v-name" id="v-name">... <i class="fas fa-check-circle" style="color: var(--brand-color);"></i></div>
                        <div class="v-cat" id="v-cat">Verified Seller</div>
                    </div>
                    <div class="v-btn">View Store</div>
                </div>
            </div>

            <!-- 🚀 DYNAMIC RECOMMENDATIONS (3 RANDOM CATEGORIES SHOWN) -->
            <div id="dynamic-category-recs"></div>

            <!-- 🚀 OTHER VENDORS SLIDER -->
            <div class="section-header-flex" style="margin-top: 40px;">
                <h3 class="section-header-title"><i class="fas fa-store" style="color: var(--brand-color);"></i> Discover Other Vendors</h3>
            </div>
            <div class="mini-slider auto-scroll-slider" id="other-vendors-slider">
                <!-- Javascript populates this -->
            </div>

            <a href="../vendors/index.html" class="view-all-btn">View More Vendors</a>

        </div>

        <div class="fixed-bottom-bar" id="action-bar" style="display: none;">
            <button class="action-btn btn-chat" onclick="openChat()"><i class="fas fa-comment-dots"></i> Chat</button>
            <button class="action-btn btn-whatsapp" id="whatsapp-btn"><i class="fab fa-whatsapp" style="font-size: 18px;"></i> WhatsApp</button>
        </div>

    </div>

    <script src="../asset/script.js"></script>

    <script>
        let currentProduct = null;
        let currentVendorUserId = null; 
        let slideInterval;

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }
        function createSlug(title) {
            return title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
        }

        // 🎲 Randomizer Function
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // 🚀 SMART BACK BUTTON FIX
        window.smartBack = function() {
            const referrer = document.referrer;
            const currentDomain = window.location.origin;
            if (!referrer || !referrer.startsWith(currentDomain) || referrer.includes('wa.me')) {
                window.location.href = "../index.html"; 
            } else {
                window.history.back();
            }
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            let productId = urlParams.get('id');
            const itemSlug = urlParams.get('item');

            if (itemSlug && itemSlug.includes('--')) {
                productId = itemSlug.split('--').pop();
            }

            if (!productId) {
                alert("Item not found!");
                window.location.href = "../items/index.html";
                return;
            }

            await loadProductDetails(productId);
            checkSavedStatus(productId);
        });

        async function loadProductDetails(productId) {
            try {
                // 1. FETCH PRODUCT
                const { data: product, error } = await supabaseClient.from('products').select('*').eq('id', productId).single();
                if (error || !product) throw error;
                currentProduct = product;

                const niceSlug = `${createSlug(product.name)}--${product.id}`;
                window.history.replaceState(null, '', `?item=${niceSlug}`);

                // 2. FETCH VENDOR
                const { data: vendor } = await supabaseClient.from('vendors').select('*').eq('id', product.vendor_id).single();

                // 3. POPULATE UI
                document.getElementById('loader-state').style.display = 'none';
                document.getElementById('content-state').style.display = 'block';
                document.getElementById('action-bar').style.display = 'flex';

                document.getElementById('display-title').innerText = product.name;
                document.getElementById('display-price').innerText = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(product.price);
                document.getElementById('display-category').innerText = product.category;
                document.getElementById('display-desc').innerText = product.description;

                // Load Images into Carousel
                const gallery = document.getElementById('image-gallery');
                const dots = document.getElementById('carousel-dots');
                gallery.innerHTML = ""; dots.innerHTML = "";

                const images = (product.image_urls && product.image_urls.length > 0) ? product.image_urls : ['https://via.placeholder.com/600x600?text=No+Image'];

                images.forEach((img, index) => {
                    gallery.innerHTML += `<img src="${escapeHTML(img)}" class="slide-img">`;
                    dots.innerHTML += `<div class="dot ${index === 0 ? 'active' : ''}"></div>`;
                });

                if (images.length > 1) startAutoSlide(); 

                // Populate Vendor
                if (vendor) {
                    currentVendorUserId = vendor.user_id; 

                    let badgeColor = "var(--brand-color)"; 
                    if (vendor.subscription_plan === "Influencer") badgeColor = "#F5A623"; 
                    if (vendor.subscription_plan === "Icon") badgeColor = "#1a2c4d"; 

                    document.getElementById('v-name').innerHTML = `${escapeHTML(vendor.business_name)} <i class="fas fa-check-circle" style="color: ${badgeColor};"></i>`;

                    const descTxt = vendor.description ? vendor.description.substring(0, 30) + '...' : "Verified Seller";
                    document.getElementById('v-cat').innerText = descTxt;

                    document.getElementById('v-logo').src = vendor.logo_url || "https://via.placeholder.com/150";

                    document.getElementById('vendor-btn').onclick = () => window.location.href = `../vendors/profile/index.html?id=${escapeJS(vendor.id)}`;

                    const waBtn = document.getElementById('whatsapp-btn');

                    let phone = vendor.whatsapp_number || "";
                    if(phone.startsWith('0')) phone = "234" + phone.substring(1);

                    const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(product.price);
                    const msg = encodeURIComponent(`Hi, I saw your ${product.name} on BRYT DGM for ${fPrice}. Is it still available?`);

                    waBtn.onclick = () => {
                        if(phone) {
                            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
                        } else {
                            alert("This vendor hasn't provided a WhatsApp number.");
                        }
                    };
                }

                // Load the new Dynamic Sliders
                await loadDynamicRecommendations(product.id, product.category);
                await loadOtherVendorsSlider(product.vendor_id);
                initAutoScroll();

            } catch (error) {
                console.error(error);
                alert("Failed to load item.");
                window.location.href = "../items/index.html";
            }
        }

        function updateDots() {
            const gallery = document.getElementById('image-gallery');
            const dots = document.querySelectorAll('.dot');
            const slideWidth = gallery.clientWidth;
            const activeIndex = Math.round(gallery.scrollLeft / slideWidth);

            dots.forEach((dot, idx) => {
                if(idx === activeIndex) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        function startAutoSlide() {
            const gallery = document.getElementById('image-gallery');
            slideInterval = setInterval(() => {
                const maxScroll = gallery.scrollWidth - gallery.clientWidth;
                if (gallery.scrollLeft >= maxScroll - 10) {
                    gallery.scrollTo({ left: 0, behavior: 'smooth' });
                } else {
                    gallery.scrollBy({ left: gallery.clientWidth, behavior: 'smooth' });
                }
            }, 3000); 
        }

        // 🚀 NEW: DYNAMIC CATEGORY RECOMMENDATIONS (Shows 3 Categories with Explore link)
        async function loadDynamicRecommendations(currentId, currentCategory) {
            const container = document.getElementById('dynamic-category-recs');
            try {
                // Fetch pool of active items excluding the currently viewed item
                const { data: products } = await supabaseClient.from('products')
                    .select('id, name, price, image_urls, category')
                    .neq('id', currentId)
                    .eq('status', 'Active')
                    .limit(1000); 

                if (!products || products.length === 0) return;

                const allCategories = ['Gadgets', 'Fashion', 'Food', 'Beauty', 'Transport', 'CampusServices', 'Books', 'Electronics'];

                // Ensure the current item's category is one of the 3 shown, then add 2 more random ones
                let otherCategories = allCategories.filter(c => c !== currentCategory);
                otherCategories = shuffleArray(otherCategories).slice(0, 2);
                const selectedCategories = [currentCategory, ...otherCategories];

                let catHtml = '';

                selectedCategories.forEach(cat => {
                    const catItems = shuffleArray(products.filter(p => p.category === cat)).slice(0, 15);

                    if (catItems.length > 0) {
                        // JS concatenation to avoid VS Code template literal bugs
                        const miniCardsHtml = catItems.map(p => {
                            const imgUrl = (p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://via.placeholder.com/300';
                            const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(p.price);
                            return '<div class="mini-card" onclick="window.location.href=\'index.html?id=' + escapeJS(p.id) + '\'">' +
                                   '<img src="' + escapeHTML(imgUrl) + '" class="mini-img" onerror="this.src=\'https://via.placeholder.com/300\'">' +
                                   '<div class="mini-price">' + fPrice + '</div>' +
                                   '<div class="mini-title">' + escapeHTML(p.name) + '</div>' +
                                   '</div>';
                        }).join('');

                        catHtml += `
                            <div class="section-header-flex">
                                <h3 class="section-header-title">
                                    <i class="fas fa-fire" style="color: #ea580c;"></i> Recommended ${cat}
                                </h3>
                                <a href="../items/index.html?cat=${encodeURIComponent(cat)}" class="section-header-link">Explore more &rarr;</a>
                            </div>
                            <div class="mini-slider auto-scroll-slider">
                                ${miniCardsHtml}
                            </div>
                        `;
                    }
                });

                container.innerHTML = catHtml;
            } catch(e) { 
                console.error("Error loading recommendations:", e); 
            }
        }

        // 🚀 OTHER VENDORS SLIDER
        async function loadOtherVendorsSlider(currentVendorId) {
            const slider = document.getElementById('other-vendors-slider');
            try {
                // Fetch pool of vendors excluding the current item's vendor
                const { data: vendors } = await supabaseClient.from('vendors')
                    .select('id, business_name, logo_url')
                    .neq('id', currentVendorId)
                    .eq('is_active', true)
                    .limit(1000); 

                if (!vendors || vendors.length === 0) {
                    slider.innerHTML = `<p style="padding: 0 20px; color: var(--text-muted); font-size: 13px;">No other vendors found.</p>`;
                    return;
                }

                const randomizedVendors = shuffleArray(vendors).slice(0, 20);

                const vendorHtml = randomizedVendors.map(v => {
                    const logo = escapeHTML(v.logo_url || 'https://via.placeholder.com/150');
                    return '<div class="vendor-mini-card" onclick="window.location.href=\'../vendors/profile/index.html?id=' + escapeJS(v.id) + '\'">' +
                           '<img src="' + logo + '" class="vendor-mini-img" onerror="this.src=\'https://via.placeholder.com/150\'">' +
                           '<div class="vendor-mini-name">' + escapeHTML(v.business_name) + '</div>' +
                           '</div>';
                }).join('');

                slider.innerHTML = vendorHtml;

            } catch(e) {
                console.error("Error loading other vendors:", e);
            }
        }

        // 🚀 UNIVERSAL AUTO-SCROLL CONTROLLER
        function initAutoScroll() {
            const sliders = document.querySelectorAll('.auto-scroll-slider');
            sliders.forEach(s => {
                if (s.children.length > 2) {
                    setInterval(() => {
                        const card = s.firstElementChild;
                        if(!card) return;
                        const maxScroll = s.scrollWidth - s.clientWidth;

                        if (s.scrollLeft >= maxScroll - 10) {
                            s.scrollTo({ left: 0, behavior: 'smooth' }); // Loop back
                        } else {
                            s.scrollBy({ left: card.offsetWidth + 12, behavior: 'smooth' }); // Scroll 1 card width
                        }
                    }, 2000); // Scrolls every 2 seconds
                }
            });
        }

        window.shareItem = function() {
            if (!currentProduct) return;
            const url = window.location.href;
            const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(currentProduct.price);
            const text = `Check out this ${currentProduct.name} for ${fPrice} on BRYT DGM!\n\n`;

            if (navigator.share) {
                navigator.share({ title: currentProduct.name, text: text, url: url }).catch(err => console.log(err));
            } else {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text + url)}`, '_blank');
            }
        }

        window.openChat = async function() {
            if (!currentProduct || !currentVendorUserId) {
                alert("Could not load vendor details. Please refresh the page and try again.");
                return;
            }

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Please log in to send a message!");
                window.location.href = "../login/index.html";
                return;
            }

            if (session.user.id === currentVendorUserId) {
                alert("You cannot chat with yourself about your own product.");
                return;
            }

            window.location.href = `../chats/index.html?product_id=${currentProduct.id}&vendor_id=${currentVendorUserId}`;
        }

        async function checkSavedStatus(productId) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) return; 

            const btn = document.getElementById('save-btn');

            const { data } = await supabaseClient
                .from('saved_items')
                .select('id')
                .match({ user_id: session.user.id, product_id: productId })
                .single();

            if (data) {
                btn.innerHTML = '<i class="fas fa-heart" style="color:#ef4444;"></i>';
                btn.setAttribute('data-saved', 'true');
            } else {
                btn.innerHTML = '<i class="far fa-heart"></i>';
                btn.setAttribute('data-saved', 'false');
            }
        }

        window.toggleSave = async function() {
            if (!currentProduct) return;

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                alert("Please log in to save items!");
                window.location.href = "../login/index.html";
                return;
            }

            const btn = document.getElementById('save-btn');
            const isSaved = btn.getAttribute('data-saved') === 'true';

            try {
                if (isSaved) {
                    btn.innerHTML = '<i class="far fa-heart"></i>';
                    btn.setAttribute('data-saved', 'false');
                    await supabaseClient.from('saved_items').delete().match({ user_id: session.user.id, product_id: currentProduct.id });
                } else {
                    btn.innerHTML = '<i class="fas fa-heart" style="color:#ef4444;"></i>';
                    btn.setAttribute('data-saved', 'true');
                    await supabaseClient.from('saved_items').insert([{
                        user_id: session.user.id,
                        product_id: currentProduct.id
                    }]);
                }
            } catch (err) {
                console.error("Error toggling save status:", err);
            }
        }
    </script>
