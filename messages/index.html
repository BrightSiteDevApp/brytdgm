<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inbox | BRYT DGM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../asset/img/bryt-app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
        }

        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif;}
        .app-container { padding-bottom: 90px; min-height: 100vh; background: #F5F8FC; }
        
        /* 🚀 NEW PREMIUM HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 30px;
            border-radius: 0 0 24px 24px;
            color: white;
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 15px rgba(29, 94, 208, 0.2);
        }
        .header-top-flex { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .page-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px;}

        .inbox-container { padding: 15px 20px; }
        
        /* 🚀 UPGRADED CHAT CARD */
        .chat-card { 
            background: white; border-radius: 18px; padding: 15px; margin-bottom: 12px; 
            display: flex; align-items: center; gap: 15px; cursor: pointer;
            border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(11, 18, 32, 0.03); transition: 0.2s;
        }
        .chat-card:active { transform: scale(0.98); background: #f5f8fc; box-shadow: 0 2px 8px rgba(11, 18, 32, 0.02);}

        .chat-avatar { 
            width: 55px; height: 55px; border-radius: 50%; object-fit: cover; 
            background: #e2e8f0; flex-shrink: 0; border: 2px solid white; box-shadow: 0 2px 8px rgba(11, 18, 32, 0.1);
        }
        
        .chat-info { flex: 1; min-width: 0; }
        .chat-header-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .chat-name { font-size: 15px; font-weight: 800; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px;}
        .chat-time { font-size: 11px; color: var(--text-muted); font-weight: 600; flex-shrink: 0; margin-left: 10px; }
        
        .chat-product { font-size: 11px; font-weight: 800; color: var(--brand-color); text-transform: uppercase; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px;}
        .chat-last-msg { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; font-weight: 500;}

        /* 🚀 EMPTY STATE */
        .empty-state { text-align: center; padding: 80px 20px; }
        .empty-state-icon { width: 80px; height: 80px; border-radius: 50%; background: rgba(29, 94, 208, 0.1); display: flex; justify-content: center; align-items: center; margin: 0 auto 20px; box-shadow: 0 10px 25px rgba(29, 94, 208, 0.1); }
        .empty-state i { font-size: 35px; color: var(--brand-color); }
        .empty-state h3 { font-size: 18px; font-weight: 800; color: var(--text-main); margin: 0 0 8px; }
        .empty-state p { font-size: 13px; color: var(--text-muted); line-height: 1.5; max-width: 250px; margin: 0 auto;}

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-card { display: flex; gap: 15px; padding: 15px; background: white; border-radius: 18px; margin-bottom: 12px; border: 1px solid #f1f5f9; box-shadow: 0 4px 15px rgba(11, 18, 32, 0.02);}
        .sk-avatar { width: 55px; height: 55px; border-radius: 50%; flex-shrink: 0;}
        .sk-lines { flex: 1; display: flex; flex-direction: column; justify-content: center;}
        .sk-line-1 { height: 16px; width: 60%; border-radius: 4px; margin-bottom: 10px; }
        .sk-line-2 { height: 12px; width: 40%; border-radius: 4px; margin-bottom: 10px; }
        .sk-line-3 { height: 12px; width: 90%; border-radius: 4px; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY THEME)      */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, var(--brand-color), var(--navy-deep)) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;}
        body.dark-mode .page-title { color: #f1f5f9 !important; }
        
        body.dark-mode .chat-card { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: none !important; }
        body.dark-mode .chat-card:active { background: #0B1220 !important; }
        
        body.dark-mode .chat-avatar { border-color: #1a2c4d !important; background: #0B1220 !important; }
        body.dark-mode .chat-name { color: #f1f5f9 !important; }
        body.dark-mode .chat-time { color: #94a3b8 !important; }
        
        body.dark-mode .chat-product { color: var(--brand-color) !important; }
        body.dark-mode .chat-last-msg { color: #cbd5e1 !important; }

        body.dark-mode .empty-state h3 { color: #f1f5f9 !important; }
        body.dark-mode .empty-state p { color: #94a3b8 !important; }
        body.dark-mode .empty-state-icon { background: #071A3A !important; box-shadow: none !important; }
        body.dark-mode .empty-state i { color: #334155 !important; }
        
        body.dark-mode .sk-card { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #071A3A 25%, #0B1220 50%, #071A3A 75%) !important; background-size: 200% 100% !important;}
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="hero-header">
            <div class="header-top-flex">
                <h1 class="page-title">Messages</h1>
            </div>
        </div>

        <div class="content-area" style="padding: 0 0 90px 0;">
            
            <div class="inbox-container" id="skeleton-loader">
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
            </div>

            <div class="inbox-container" id="inbox-list" style="display: none;"></div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" style="color: var(--brand-color);">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            <div class="nav-fab" onclick="window.location.href='../add-product/index.html'"><i class="fas fa-plus"></i></div>
            <a href="../saved/index.html" class="nav-item"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="../account/index.html" class="nav-item"><i class="fas fa-user"></i><span>Account</span></a>
        </div>
    </div>

    <script src="../asset/script.js"></script>

    <script>
        let currentUser = null;

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
        function escapeJS(str) {
            if (!str) return '';
            return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, '\\n');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = "../login/index.html"; return; }
            currentUser = session.user;
            
            await loadInbox();
            setupRealtimeInbox();
        });

        async function loadInbox() {
            const list = document.getElementById('inbox-list');
            const skeleton = document.getElementById('skeleton-loader');

            try {
                const { data: chats, error } = await supabaseClient
                    .from('chats')
                    .select('*')
                    .or('customer_id.eq.' + currentUser.id + ',vendor_id.eq.' + currentUser.id)
                    .order('last_message_time', { ascending: false });

                if (error) throw error;

                skeleton.style.display = 'none';
                list.style.display = 'block';

                if (!chats || chats.length === 0) {
                    list.innerHTML = 
                        '<div class="empty-state">' +
                            '<div class="empty-state-icon"><i class="fas fa-inbox"></i></div>' +
                            '<h3>No Messages Yet</h3>' +
                            '<p>When you contact a vendor or a customer messages you, the chat will appear here.</p>' +
                        '</div>';
                    return;
                }

                const productIds = [...new Set(chats.map(c => c.product_id))];
                const customerIds = [...new Set(chats.map(c => c.customer_id))];
                const vendorIds = [...new Set(chats.map(c => c.vendor_id))];

                const [prodRes, profRes, vendRes] = await Promise.all([
                    supabaseClient.from('products').select('id, name').in('id', productIds),
                    supabaseClient.from('profiles').select('id, full_name, avatar_url').in('id', customerIds),
                    supabaseClient.from('vendors').select('user_id, business_name, logo_url').in('user_id', vendorIds)
                ]);

                const prodDict = {}; prodRes.data?.forEach(p => prodDict[p.id] = p);
                const profDict = {}; profRes.data?.forEach(p => profDict[p.id] = p);
                const vendDict = {}; vendRes.data?.forEach(v => vendDict[v.user_id] = v);

                const htmlStrings = chats.map(chat => {
                    const amICustomer = currentUser.id === chat.customer_id;
                    const productData = prodDict[chat.product_id] || { name: "Unknown Item" };
                    
                    let displayName = "";
                    let displayAvatar = "";
                    let isVerified = false;
                    let hasUnread = false;

                    if (amICustomer) {
                        const vData = vendDict[chat.vendor_id];
                        displayName = vData ? vData.business_name : "Store Vendor";
                        displayAvatar = vData && vData.logo_url ? vData.logo_url : "../asset/img/person.png";
                        isVerified = true;
                        hasUnread = chat.unread_by_customer;
                    } else {
                        const cData = profDict[chat.customer_id];
                        displayName = cData ? cData.full_name : "Customer";
                        displayAvatar = cData && cData.avatar_url ? cData.avatar_url : "../asset/img/person.png";
                        hasUnread = chat.unread_by_vendor;
                    }

                    const timeAgo = formatChatTime(chat.last_message_time);
                    const lastMsg = chat.last_message_text || "Started a conversation";
                    
                    const dotIndicator = hasUnread ? '<span style="display:inline-block; width:10px; height:10px; background:var(--brand-color); border-radius:50%; flex-shrink: 0;"></span>' : '';
                    const boldText = hasUnread ? 'font-weight: 800; color: var(--text-main);' : '';
                    const verifiedIcon = isVerified ? '<i class="fas fa-check-circle" style="color: var(--brand-color); font-size: 11px;"></i>' : '';

                    return '<div class="chat-card" onclick="window.location.href=\'../chats/index.html?chat_id=' + escapeJS(chat.id) + '\'">' +
                                '<img src="' + escapeHTML(displayAvatar) + '" class="chat-avatar" onerror="this.src=\'../asset/img/person.png\'">' +
                                '<div class="chat-info">' +
                                    '<div class="chat-header-row">' +
                                        '<div class="chat-name">' + escapeHTML(displayName) + ' ' + verifiedIcon + '</div>' +
                                        '<div class="chat-time" style="' + boldText + '">' + escapeHTML(timeAgo) + '</div>' +
                                    '</div>' +
                                    '<div class="chat-product"><i class="fas fa-box"></i> ' + escapeHTML(productData.name) + '</div>' +
                                    '<div class="chat-last-msg" style="' + boldText + '">' + dotIndicator + escapeHTML(lastMsg) + '</div>' +
                                '</div>' +
                            '</div>';
                });

                list.innerHTML = htmlStrings.join('');

            } catch (err) {
                console.error("Failed to load inbox:", err);
                skeleton.style.display = 'none';
                list.style.display = 'block';
                list.innerHTML = '<p style="text-align:center; color:#ef4444; font-weight: 600; font-size: 13px;">Error loading messages. Please check your connection.</p>';
            }
        }

        function setupRealtimeInbox() {
            supabaseClient.channel('inbox-updates')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chats' }, () => {
                    loadInbox(); 
                })
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chats' }, () => {
                    loadInbox(); 
                })
                .subscribe();
        }

        function formatChatTime(dateString) {
            if (!dateString) return "";
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

            if (diffDays === 0 && now.getDate() === date.getDate()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (diffDays === 1 || (diffDays === 0 && now.getDate() !== date.getDate())) {
                return "Yesterday";
            } else if (diffDays < 7) {
                return date.toLocaleDateString([], { weekday: 'short' });
            } else {
                return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
            }
        }
    </script>
</body>
</html>
