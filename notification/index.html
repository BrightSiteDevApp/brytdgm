<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notifications | BRYT DGM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../asset/img/bryt-app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <style>
        /* 🚀 BRYT TECHNOLOGIES VARIABLES */
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --navy-deep: #071A3A;
            --text-main: #0B1220;
            --text-muted: #64748b;
        }

        body, html { background: #F5F8FC; margin: 0; padding: 0; font-family: 'Sora', sans-serif;}
        .app-container { padding-bottom: 90px; min-height: 100vh; position: relative; background: #F5F8FC;}

        /* 🚀 PREMIUM HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 65px 20px;
            border-radius: 0 0 30px 30px;
            color: white;
            position: relative;
        }
        .header-top-flex { display: flex; align-items: center; gap: 15px; margin-bottom: 5px; }
        .back-btn { color: white; font-size: 20px; cursor: pointer; background: rgba(255,255,255,0.2); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; backdrop-filter: blur(5px); transition: 0.2s;}
        .back-btn:active { transform: scale(0.9); }
        .page-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px;}
        .page-subtitle { font-size: 13px; color: #bae6fd; margin-top: 5px; margin-left: 55px; font-weight: 500; }

        /* 🚀 FLOATING ACTION AREA */
        .action-area { 
            margin: -35px 20px 15px; position: relative; z-index: 10; 
            display: flex; justify-content: flex-end;
        }
        
        .clear-btn { 
            background: white; color: var(--text-main); border: 1px solid #e2e8f0; 
            padding: 10px 16px; border-radius: 14px; font-weight: 800; font-size: 12px; font-family: 'Sora', sans-serif;
            cursor: pointer; box-shadow: 0 8px 20px rgba(11, 18, 32, 0.05);
            transition: 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .clear-btn:active { transform: scale(0.96); box-shadow: 0 2px 8px rgba(11, 18, 32, 0.03); }
        .clear-btn i { color: var(--brand-color); font-size: 14px; }

        .notif-container { padding: 0 20px; }

        /* 🚀 PREMIUM NOTIFICATION CARDS */
        .notif-card {
            background: white; border-radius: 20px; padding: 18px 15px; margin-bottom: 15px;
            display: flex; gap: 15px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(11, 18, 32, 0.02);
            position: relative; overflow: hidden; transition: 0.2s;
        }
        
        .notif-card.unread { background: #f5f8fc; border-color: #bfdbfe; box-shadow: 0 4px 15px rgba(29, 94, 208, 0.05);}
        .notif-card.unread::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 5px; background: var(--brand-color); }

        .notif-icon-wrapper { width: 45px; height: 45px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }

        /* Icon Types */
        .icon-system { background: #F5F8FC; color: #475569; }
        .icon-promo { background: rgba(29, 94, 208, 0.1); color: var(--brand-color); }
        .icon-alert { background: #fef2f2; color: #ef4444; }
        .icon-success { background: #ecfdf5; color: #10b981; }

        .notif-content { flex: 1; min-width: 0; }
        .notif-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .notif-title { font-size: 14px; font-weight: 800; color: var(--text-main); line-height: 1.3;}
        .notif-time { font-size: 11px; color: var(--text-muted); font-weight: 700; white-space: nowrap; margin-left: 10px; }
        
        .notif-message { font-size: 13px; color: #475569; line-height: 1.5; word-wrap: break-word; font-weight: 500;}
        
        .read-more-btn { color: var(--brand-color); font-weight: 800; cursor: pointer; font-size: 11px; margin-top: 6px; display: inline-block; background: rgba(29, 94, 208, 0.1); padding: 5px 12px; border-radius: 8px; text-transform: uppercase; letter-spacing: 0.5px;}

        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; display: none; flex-direction: column; align-items: center; background: white; border-radius: 24px; border: 2px dashed #cbd5e1; margin-bottom: 20px;}
        .empty-icon-wrapper { width: 70px; height: 70px; border-radius: 50%; background: #F5F8FC; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        .empty-icon-wrapper i { font-size: 30px; color: #94a3b8; }
        .empty-state h3 { font-size: 18px; font-weight: 800; color: var(--text-main); margin: 0 0 8px; letter-spacing: -0.3px;}
        .empty-state p { font-size: 13px; color: var(--text-muted); line-height: 1.5; max-width: 250px; font-weight: 500;}

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: 6px;}
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-card { display: flex; gap: 15px; padding: 20px 15px; background: white; border-radius: 20px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .sk-avatar { width: 45px; height: 45px; border-radius: 14px; flex-shrink: 0; }
        .sk-lines { flex: 1; }
        .sk-line-1 { height: 14px; width: 50%; margin-bottom: 12px; }
        .sk-line-2 { height: 12px; width: 90%; margin-bottom: 8px; }
        .sk-line-3 { height: 12px; width: 70%; }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY THEME)      */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, var(--brand-color), var(--navy-deep)) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;}
        body.dark-mode .back-btn { background: rgba(255,255,255,0.1) !important; }
        body.dark-mode .page-title { color: #f1f5f9 !important; }

        body.dark-mode .clear-btn { background: #071A3A !important; color: #f1f5f9 !important; border-color: #1a2c4d !important; box-shadow: 0 8px 20px rgba(0,0,0,0.5) !important;}
        
        body.dark-mode .notif-card { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: none !important; }
        body.dark-mode .notif-card.unread { background: #0B1220 !important; border-color: var(--brand-color) !important; }
        
        body.dark-mode .notif-title { color: #f1f5f9 !important; }
        body.dark-mode .notif-message { color: #cbd5e1 !important; }
        body.dark-mode .notif-time { color: #94a3b8 !important; }
        
        body.dark-mode .icon-system { background: #0B1220 !important; color: #94a3b8 !important; }
        body.dark-mode .icon-promo { background: rgba(29, 94, 208, 0.1) !important; color: var(--brand-color) !important; }
        body.dark-mode .icon-alert { background: rgba(239, 68, 68, 0.1) !important; color: #fca5a5 !important; }
        body.dark-mode .icon-success { background: rgba(16, 185, 129, 0.1) !important; color: #6ee7b7 !important; }

        body.dark-mode .read-more-btn { background: #0B1220 !important; border: 1px solid #1a2c4d; }

        body.dark-mode .empty-state { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .empty-icon-wrapper { background: #0B1220 !important; }
        body.dark-mode .empty-state h3 { color: #f1f5f9 !important; }
        body.dark-mode .empty-state p { color: #94a3b8 !important; }
        body.dark-mode .empty-state i { color: #334155 !important; }
        
        body.dark-mode .sk-card { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #071A3A 25%, #0B1220 50%, #071A3A 75%) !important; background-size: 200% 100% !important; }
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <!-- 🚀 NEW HERO HEADER -->
        <div class="hero-header">
            <div class="header-top-flex">
                <button onclick="window.history.back()" class="back-btn"><i class="fas fa-arrow-left"></i></button>
                <h1 class="page-title">Notifications</h1>
            </div>
            <div class="page-subtitle">Stay updated with the latest alerts</div>
        </div>

        <!-- 🚀 FLOATING ACTION AREA -->
        <div class="action-area">
            <button class="clear-btn" onclick="markAllAsRead()">
                <i class="fas fa-check-double"></i> Mark all as read
            </button>
        </div>

        <div class="notif-container">
            
            <div id="skeleton-loader">
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-avatar"></div><div class="sk-lines"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div><div class="sk-shimmer sk-line-3"></div></div></div>
            </div>

            <div class="empty-state" id="empty-state">
                <div class="empty-icon-wrapper"><i class="fas fa-bell-slash"></i></div>
                <h3>All Caught Up!</h3>
                <p>You don't have any new notifications right now. Check back later!</p>
            </div>

            <div id="notification-list"></div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item"><i class="fas fa-home"></i><span>Home</span></a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')"><i class="fas fa-plus"></i></div>
            <a href="#" class="nav-item" onclick="requireLogin('../saved/index.html')"><i class="fas fa-heart"></i><span>Saved</span></a>
            <a href="../account/index.html" class="nav-item"><i class="fas fa-user"></i><span>Account</span></a>
        </div>
    </div>

    <script src="../asset/script.js"></script>

    <script>
        let currentUser = null;
        let currentlyOpenId = null;

        // 🛡️ XSS Sanitizers
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
            }
            
            await fetchNotifications();
        });

        async function requireLogin(targetUrl) {
            if (currentUser) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        async function fetchNotifications() {
            const list = document.getElementById('notification-list');
            const skeleton = document.getElementById('skeleton-loader');
            const emptyState = document.getElementById('empty-state');

            try {
                let query = supabaseClient
                    .from('notifications')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(30);

                if (currentUser) {
                    query = query.or('user_id.eq.' + currentUser.id + ',user_id.is.null');
                } else {
                    query = query.is('user_id', null);
                }

                const { data, error } = await query;

                if (error && error.code !== '42P01') throw error; 

                skeleton.style.display = 'none';

                if (!data || data.length === 0) {
                    emptyState.style.display = 'flex';
                    return;
                }

                const lastClearedTime = new Date(localStorage.getItem('notifs_cleared_time') || '2000-01-01');

                list.innerHTML = "";
                
                const htmlStrings = data.map(n => {
                    const notifTime = new Date(n.created_at);
                    
                    const isUnread = notifTime > lastClearedTime && n.is_read !== true;
                    const unreadClass = isUnread ? "unread" : "";
                    
                    const timeString = formatTime(notifTime);
                    const config = getIconConfig(n.type);

                    const safeTitle = escapeHTML(n.title);
                    const safeMessage = escapeHTML(n.message);

                    const words = safeMessage.split(' ');
                    let hasMore = false;
                    let shortMsg = safeMessage;

                    if (words.length > 15) {
                        shortMsg = words.slice(0, 15).join(' ') + '...';
                        hasMore = true;
                    }

                    const readMoreBtnHtml = hasMore ? '<br><div class="read-more-btn" id="btn-' + n.id + '" onclick="toggleNotif(\'' + n.id + '\')">Read more</div>' : '';

                    return '<div class="notif-card ' + unreadClass + '">' +
                                '<div class="notif-icon-wrapper ' + config.bgClass + '">' +
                                    '<i class="' + config.icon + '"></i>' +
                                '</div>' +
                                '<div class="notif-content">' +
                                    '<div class="notif-header">' +
                                        '<div class="notif-title">' + safeTitle + '</div>' +
                                        '<div class="notif-time">' + timeString + '</div>' +
                                    '</div>' +
                                    '<div class="notif-message">' +
                                        '<span class="short-text" id="short-' + n.id + '">' + shortMsg + '</span>' +
                                        '<span class="full-text" id="full-' + n.id + '" style="display:none;">' + safeMessage + '</span>' +
                                        readMoreBtnHtml +
                                    '</div>' +
                                '</div>' +
                           '</div>';
                });

                list.innerHTML = htmlStrings.join('');

            } catch (err) {
                console.error("Failed to load notifications:", err);
                skeleton.style.display = 'none';
                emptyState.style.display = 'flex';
            }
        }

        window.toggleNotif = function(id) {
            if (currentlyOpenId && currentlyOpenId !== id) {
                document.getElementById('short-' + currentlyOpenId).style.display = 'inline';
                document.getElementById('full-' + currentlyOpenId).style.display = 'none';
                document.getElementById('btn-' + currentlyOpenId).innerText = 'Read more';
            }

            const shortEl = document.getElementById('short-' + id);
            const fullEl = document.getElementById('full-' + id);
            const btnEl = document.getElementById('btn-' + id);

            if (fullEl.style.display === 'none') {
                shortEl.style.display = 'none';
                fullEl.style.display = 'inline';
                btnEl.innerText = 'Show less';
                currentlyOpenId = id;
            } else {
                shortEl.style.display = 'inline';
                fullEl.style.display = 'none';
                btnEl.innerText = 'Read more';
                currentlyOpenId = null;
            }
        };

        async function markAllAsRead() {
            localStorage.setItem('notifs_cleared_time', new Date().toISOString());
            
            document.querySelectorAll('.notif-card.unread').forEach(card => {
                card.classList.remove('unread');
            });
            
            if (currentUser) {
                try {
                    await supabaseClient
                        .from('notifications')
                        .update({ is_read: true })
                        .eq('user_id', currentUser.id)
                        .eq('is_read', false);
                } catch(e) {
                    console.error("Failed to sync read status", e);
                }
            }
            
            document.querySelectorAll('.notify-dot').forEach(dot => dot.style.display = 'none');
        }

        function getIconConfig(type) {
            switch (type ? type.toLowerCase() : '') {
                case 'promo': return { icon: 'fas fa-bullhorn', bgClass: 'icon-promo' };
                case 'alert': return { icon: 'fas fa-exclamation-triangle', bgClass: 'icon-alert' };
                case 'success': return { icon: 'fas fa-check-circle', bgClass: 'icon-success' };
                default: return { icon: 'fas fa-bell', bgClass: 'icon-system' }; 
            }
        }

        function formatTime(date) {
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 60) return diffMins <= 1 ? "Just now" : diffMins + "m ago";
            if (diffHours < 24) return diffHours + "h ago";
            if (diffDays === 1) return "Yesterday";
            if (diffDays < 7) return diffDays + "d ago";
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
