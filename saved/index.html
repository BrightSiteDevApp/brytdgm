<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-70VSGR5WBW"></script>
    
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Saved Items | BRYT DGM</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../asset/style.css">
    <link rel="icon" href="../asset/img/bryt-app-logo.png" type="image/png" sizes="192x192">
    <link rel="icon" href="../favicon.ico" type="image/x-icon">

    <style>
        /* 🚀 STRICT BOX SIZING & BRYT TECHNOLOGIES VARIABLES */
        *, *::before, *::after { box-sizing: border-box !important; }
        html, body { max-width: 100vw !important; overflow-x: hidden !important; margin: 0; padding: 0; font-family: 'Sora', sans-serif;}
        
        :root {
            --brand-color: #1D5ED0; 
            --brand-hover: #159FE3;
            --text-main: #0B1220;
            --text-muted: #64748b;
            --navy-deep: #071A3A;
        }

        .app-container { padding-bottom: 90px; min-height: 100vh; background: #F5F8FC; }

        /* 🚀 PREMIUM HERO HEADER */
        .hero-header {
            background: linear-gradient(135deg, var(--brand-color), var(--navy-deep));
            padding: 20px 20px 30px;
            border-radius: 0 0 24px 24px;
            color: white;
            position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 4px 15px rgba(29, 94, 208, 0.2);
        }
        .header-top-flex { display: flex; align-items: center; justify-content: space-between; width: 100%; }
        .page-title { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -0.5px;}

        /* 🚀 PREMIUM EDGE-TO-EDGE PRODUCT CARDS */
        .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; width: 100%; }

        .product-card { 
            background: white; border-radius: 20px; padding: 0; box-shadow: 0 6px 20px rgba(11, 18, 32, 0.04); 
            cursor: pointer; border: 1px solid #e2e8f0; position: relative; transition: 0.2s; 
            width: 100%; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column;
        }
        .product-card:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(11, 18, 32, 0.02); }
        
        .product-img-wrap { position: relative; width: 100%; height: 160px; background: #f5f8fc; }
        .product-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        
        /* Floating Price Badge */
        .product-price-badge { 
            position: absolute; bottom: 10px; right: 10px; background: rgba(255,255,255,0.95); 
            color: var(--brand-color); font-size: 14px; font-weight: 800; padding: 6px 12px; 
            border-radius: 12px; backdrop-filter: blur(5px); box-shadow: 0 4px 10px rgba(11, 18, 32, 0.1);
        }

        /* Sleek Frosted Glass Remove Button */
        .remove-btn { 
            position: absolute; top: 10px; right: 10px; 
            background: rgba(255, 255, 255, 0.9); color: #ef4444; 
            width: 34px; height: 34px; border-radius: 10px; 
            display: flex; justify-content: center; align-items: center; 
            backdrop-filter: blur(8px); font-size: 15px; border: none; 
            cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(11, 18, 32, 0.1); z-index: 10;
        }
        .remove-btn:active { transform: scale(0.9); background: #ef4444; color: white; }

        .product-info { padding: 15px 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;}
        .product-title { font-size: 13px; font-weight: 800; color: var(--text-main); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px;}
        .product-category { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}

        /* Empty State */
        .empty-state { text-align: center; padding: 60px 20px; display: none; flex-direction: column; align-items: center; grid-column: 1 / -1; width: 100%;}
        .empty-icon-wrapper { width: 80px; height: 80px; border-radius: 50%; background: #eff6ff; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(29, 94, 208, 0.1);}
        .empty-icon-wrapper i { font-size: 35px; color: var(--brand-color); }
        .empty-state h3 { font-size: 20px; font-weight: 800; color: var(--text-main); margin: 0 0 10px; letter-spacing: -0.3px;}
        .empty-state p { font-size: 14px; color: var(--text-muted); margin-bottom: 30px; line-height: 1.6; max-width: 300px; font-weight: 500;}
        .explore-btn { background: var(--brand-color); color: white; padding: 14px 30px; border-radius: 14px; font-weight: 800; font-family: 'Sora', sans-serif; font-size: 15px; text-decoration: none; box-shadow: 0 8px 20px rgba(29, 94, 208, 0.3); transition: 0.2s; display: inline-block;}
        .explore-btn:active { transform: scale(0.96); }

        /* Skeletons */
        .sk-shimmer { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .sk-card { background: white; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden;}
        .sk-img { width: 100%; height: 160px; border-radius: 0; }
        .sk-info { padding: 15px 12px; }
        .sk-line-1 { width: 80%; height: 14px; border-radius: 4px; margin-bottom: 10px; }
        .sk-line-2 { width: 50%; height: 12px; border-radius: 4px; }

        /* Mobile Fixes */
        @media (max-width: 360px) {
            .items-grid { grid-template-columns: 1fr; }
        }

        /* ========================================= */
        /* 🌙 DARK MODE FIXES (BRYT NAVY THEME)      */
        /* ========================================= */
        body.dark-mode { background-color: #071A3A !important; }
        body.dark-mode .app-container { background: #0B1220 !important; }
        
        body.dark-mode .hero-header { background: linear-gradient(135deg, var(--brand-color), var(--navy-deep)) !important; box-shadow: 0 4px 15px rgba(0,0,0,0.5) !important;}
        body.dark-mode .page-title { color: #f1f5f9 !important; }
        
        body.dark-mode .empty-state h3 { color: #f1f5f9 !important; }
        body.dark-mode .empty-state p { color: #94a3b8 !important; }
        body.dark-mode .empty-icon-wrapper { background: #071A3A !important; box-shadow: none; }
        
        body.dark-mode .product-card { background: #071A3A !important; border-color: #1a2c4d !important; box-shadow: none !important;}
        body.dark-mode .product-img-wrap { background: #0B1220 !important; }
        body.dark-mode .product-title { color: #f1f5f9 !important; }
        body.dark-mode .product-category { color: #94a3b8 !important; }
        body.dark-mode .product-price-badge { background: rgba(11, 18, 32, 0.95) !important; color: #60a5fa !important; border: 1px solid #1a2c4d; }
        
        body.dark-mode .remove-btn { background: rgba(11, 18, 32, 0.8) !important; color: #ef4444 !important; }
        body.dark-mode .remove-btn:active { background: #ef4444 !important; color: white !important; }
        
        body.dark-mode .sk-card { background: #071A3A !important; border-color: #1a2c4d !important; }
        body.dark-mode .sk-shimmer { background: linear-gradient(90deg, #071A3A 25%, #0B1220 50%, #071A3A 75%) !important; background-size: 200% 100% !important;}
    </style>
</head>
<body>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }
    </script>

    <div class="app-container">
        
        <!-- 🚀 NEW HERO HEADER -->
        <div class="hero-header">
            <div class="header-top-flex">
                <h1 class="page-title">Saved Items</h1>
            </div>
        </div>

        <div class="content-area" style="padding: 0 0 90px 0; width: 100%;">
            
            <div class="empty-state" id="empty-state">
                <div class="empty-icon-wrapper"><i class="fas fa-heart"></i></div>
                <h3>No Saved Items</h3>
                <p>You haven't saved any items yet. Explore the marketplace and tap the heart icon to save things you like!</p>
                <a href="../items/index.html" class="explore-btn">Explore Market</a>
            </div>

            <div class="items-grid" id="main-items-grid"></div>

            <div class="items-grid" id="skeleton-loader" style="padding-top: 20px;">
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-info"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-info"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-info"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div></div>
                <div class="sk-card"><div class="sk-shimmer sk-img"></div><div class="sk-info"><div class="sk-shimmer sk-line-1"></div><div class="sk-shimmer sk-line-2"></div></div></div>
            </div>

        </div>

        <div class="bottom-nav">
            <a href="../index.html" class="nav-item">
                <i class="fas fa-home"></i><span>Home</span>
            </a>
            <a href="#" class="nav-item" onclick="requireLogin('../messages/index.html')">
                <i class="fas fa-comment-dots"></i>
                <span class="red-dot msg-dot"></span>
                <span>Messages</span>
            </a>
            
            <div class="nav-fab" onclick="requireLogin('../add-product/index.html')">
                <i class="fas fa-plus"></i>
            </div>
            
            <a href="#" class="nav-item" style="color: var(--brand-color);">
                <i class="fas fa-heart"></i><span>Saved</span>
            </a>
            <a href="#" class="nav-item" onclick="requireLogin('../account/index.html')">
                <i class="fas fa-user"></i><span>Account</span>
            </a>
        </div>

    </div>

    <script src="../asset/script.js"></script>

   <script>
        let currentUser = null;
        let savedProducts = [];

        // Failsafe escape HTML function
        const safeHTML = (str) => str ? String(str).replace(/[&<>'"]/g, 
            tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag])) : '';

        document.addEventListener("DOMContentLoaded", async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "../login/index.html";
                return;
            }
            currentUser = session.user;
            fetchSavedItems();
        });

        async function requireLogin(targetUrl) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = targetUrl;
            else window.location.href = "../login/index.html";
        }

        async function fetchSavedItems() {
            const grid = document.getElementById('main-items-grid');
            const skeleton = document.getElementById('skeleton-loader');
            const emptyState = document.getElementById('empty-state');
            
            try {
                const { data: savedData, error: savedError } = await supabaseClient
                    .from('saved_items')
                    .select('product_id')
                    .eq('user_id', currentUser.id);

                if (savedError) throw savedError;

                const savedIds = savedData.map(item => item.product_id);

                if (savedIds.length === 0) {
                    skeleton.style.display = 'none';
                    emptyState.style.display = 'flex';
                    return;
                }

                const { data: products, error: prodError } = await supabaseClient
                    .from('products')
                    .select('id, name, price, category, image_urls')
                    .in('id', savedIds)
                    .eq('status', 'Active');

                if (prodError) throw prodError;

                savedProducts = products;
                skeleton.style.display = 'none';

                if (savedProducts.length === 0) {
                    emptyState.style.display = 'flex';
                    return;
                }

                renderGrid();

            } catch (error) {
                console.error(error);
                skeleton.style.display = 'none';
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:#ef4444; padding: 40px; font-weight:600;">Failed to load saved items. Please refresh.</p>';
            }
        }

        function renderGrid() {
            const grid = document.getElementById('main-items-grid');
            grid.innerHTML = "";

            const htmlStrings = savedProducts.map(p => {
                const imgUrl = (p.image_urls && p.image_urls.length > 0) ? p.image_urls[0] : 'https://via.placeholder.com/300x300?text=No+Image';
                const fPrice = new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN', maximumFractionDigits: 0 }).format(p.price);

                return '<div class="product-card" id="card-' + p.id + '" onclick="window.location.href=\'../product/index.html?id=' + p.id + '\'">' +
                            '<div class="product-img-wrap">' +
                                '<button class="remove-btn" onclick="removeItem(\'' + p.id + '\', event)"><i class="fas fa-trash-alt"></i></button>' +
                                '<img src="' + imgUrl + '" class="product-img" onerror="this.src=\'https://via.placeholder.com/300x300?text=No+Image\'">' +
                                '<div class="product-price-badge">' + fPrice + '</div>' +
                            '</div>' +
                            '<div class="product-info">' +
                                '<div class="product-title">' + safeHTML(p.name) + '</div>' +
                                '<div class="product-category"><i class="fas fa-layer-group" style="color: var(--brand-color);"></i> ' + safeHTML(p.category) + '</div>' +
                            '</div>' +
                       '</div>';
            });

            grid.innerHTML = htmlStrings.join('');
        }

        window.removeItem = async function(productId, event) {
            event.stopPropagation(); 
            
            const card = document.getElementById('card-' + productId);
            if(card) {
                card.style.transform = 'scale(0.8)';
                card.style.opacity = '0';
                card.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    card.remove();
                    savedProducts = savedProducts.filter(p => p.id !== productId);
                    if (savedProducts.length === 0) {
                        document.getElementById('empty-state').style.display = 'flex';
                    }
                }, 250);
            }

            try {
                await supabaseClient
                    .from('saved_items')
                    .delete()
                    .match({ user_id: currentUser.id, product_id: productId });
            } catch (err) {
                console.error("Failed to delete from database:", err);
            }
        }
    </script>
</body>
</html>
